
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#091426">
<title>SIMPLEXPING | Messages</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #091426;
  color: #f1f5fb;
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 850px;
  min-height: 100vh;
  margin: auto;
  background: #101f35;
  display: flex;
  flex-direction: column;
}

header {
  padding: 18px;
  background: #142640;
  border-bottom: 1px solid #263b56;
}

.top {
  display: flex;
  align-items: center;
  gap: 12px;
}

.back {
  color: #a9c6ec;
  text-decoration: none;
  font-size: 27px;
}

h1 {
  font-size: 22px;
  margin: 0;
}

.subtitle {
  color: #91a9c6;
  font-size: 14px;
  margin: 10px 0 0;
}

#status {
  padding: 12px;
  text-align: center;
  font-size: 13px;
  color: #a9c6ec;
  overflow-wrap: anywhere;
}

#contactList {
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.contact {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: #172b45;
  border: 1px solid #29415f;
  border-radius: 12px;
}

.avatar {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #28518a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 18px;
  flex-shrink: 0;
  overflow: hidden;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.has-photo {
  cursor: pointer;
}

.contact-info {
  flex: 1;
  min-width: 0;
}

.contact-info h3,
.chat-header h3 {
  margin: 0;
  font-size: 15px;
  overflow-wrap: anywhere;
}

.contact-info p,
.chat-header p {
  color: #91a9c6;
  font-size: 12px;
  margin: 5px 0 0;
}

button {
  border: 0;
  border-radius: 22px;
  background: #3978c7;
  color: white;
  font-weight: bold;
  padding: 11px 16px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: wait;
}

.empty {
  text-align: center;
  color: #91a9c6;
  padding: 25px 15px;
  line-height: 1.7;
}

.empty a {
  color: #8fc2ff;
  display: inline-block;
  margin-top: 12px;
}

#chatScreen {
  display: none;
  flex: 1;
  min-height: 0;
  flex-direction: column;
}

.chat-header {
  padding: 13px 16px;
  background: #142640;
  border-bottom: 1px solid #263b56;
  display: flex;
  align-items: center;
  gap: 12px;
}

.chat-header .avatar {
  width: 40px;
  height: 40px;
}

#messages {
  flex: 1;
  min-height: 250px;
  padding: 15px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.message {
  max-width: 88%;
  padding: 12px 15px;
  border-radius: 15px;
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  cursor: pointer;
}

.sent {
  align-self: flex-end;
  background: #285b9b;
  border-bottom-right-radius: 4px;
}

.received {
  align-self: flex-start;
  background: #20344f;
  border-bottom-left-radius: 4px;
}

.message:focus-visible {
  outline: 2px solid #8fc2ff;
  outline-offset: 2px;
}

.message-time {
  display: block;
  font-size: 10px;
  color: #c1d0e4;
  margin-top: 7px;
  text-align: right;
}

.message-image,
.message-video {
  display: block;
  max-width: 100%;
  max-height: 350px;
  width: auto;
  height: auto;
  border-radius: 9px;
  object-fit: contain;
}

.message-image {
  cursor: pointer;
}

.message-video {
  width: 280px;
  max-width: 100%;
}

.message-audio {
  display: block;
  width: 270px;
  max-width: 100%;
  margin-top: 5px;
}

.message-caption {
  margin-bottom: 8px;
}

/* Quoted message inside a reply */
.reply-quote {
  display: block;
  width: 100%;
  text-align: left;
  padding: 8px 10px;
  margin-bottom: 9px;
  border-radius: 7px;
  border-left: 3px solid #8fc2ff;
  background: rgba(5, 15, 30, .28);
  color: #e2edfc;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.reply-quote strong {
  display: block;
  color: #8fc2ff;
  margin-bottom: 3px;
}

.reply-quote span {
  display: block;
}

/* Reply preview above the typing area */
#replyPreview {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: #0d1b30;
  border-top: 1px solid #304965;
}

#replyPreview[hidden],
#emojiPicker[hidden] {
  display: none !important;
}

.reply-preview-content {
  flex: 1;
  min-width: 0;
  border-left: 3px solid #60a5fa;
  padding-left: 10px;
  overflow-wrap: anywhere;
}

#replyPreviewName {
  display: block;
  color: #8fc2ff;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 3px;
}

#replyPreviewText {
  display: block;
  color: #d8e5f6;
  font-size: 13px;
  overflow-wrap: anywhere;
}

#cancelReply {
  background: #263b56;
  padding: 8px 12px;
  flex-shrink: 0;
}

/* Emoji picker */
#emojiPicker {
  padding: 10px;
  background: #0d1b30;
  border-top: 1px solid #304965;
}

#emojiPickerTitle {
  margin: 0 0 8px;
  color: #a9c6ec;
  font-size: 12px;
}

#emojiGrid {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  gap: 5px;
}

.emoji-button {
  padding: 7px 0;
  border-radius: 8px;
  background: #20344f;
  font-size: 23px;
  line-height: 1.2;
}

.emoji-button:hover {
  background: #315783;
}

#messageForm {
  display: flex;
  gap: 8px;
  padding: 12px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: #142640;
  border-top: 1px solid #263b56;
  align-items: center;
}

#messageInput {
  flex: 1;
  min-width: 0;
  height: 46px;
  padding: 0 15px;
  border: 1px solid #304965;
  border-radius: 25px;
  outline: none;
  background: #0b1a2e;
  color: white;
  font-size: 16px;
}

#messageInput::placeholder {
  color: #91a9c6;
}

#emojiToggle {
  width: 44px;
  height: 44px;
  padding: 0;
  flex-shrink: 0;
  background: #203d60;
  font-size: 23px;
}

#attachmentButtons {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  padding: 10px 12px;
  background: #142640;
  align-items: center;
}

.attach-button {
  padding: 9px 13px;
  font-size: 13px;
  background: #203d60;
  border: 1px solid #355579;
  white-space: nowrap;
}

#mediaHelp {
  color: #91a9c6;
  font-size: 11px;
  padding: 0 13px 10px;
  background: #142640;
  line-height: 1.5;
}

#photoViewer {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  padding: 65px 18px 28px;
  background: rgba(0,0,0,.94);
}

[hidden],
#photoViewer[hidden] {
  display: none !important;
}

#closePhotoViewer {
  position: absolute;
  top: max(16px, env(safe-area-inset-top));
  right: 16px;
  width: 44px;
  height: 44px;
  padding: 0;
  font-size: 22px;
  background: #263b56;
}

#enlargedPhoto {
  max-width: 100%;
  max-height: 75vh;
  max-height: 75dvh;
  object-fit: contain;
  border-radius: 8px;
}

#enlargedPhotoName {
  color: white;
  font-size: 16px;
  text-align: center;
  overflow-wrap: anywhere;
}

@media (min-width: 600px) {
  .container {
    min-height: 90vh;
    max-height: 900px;
    margin-top: 5vh;
    border-radius: 16px;
    overflow: hidden;
  }
}

@media (max-width: 380px) {
  #messageForm {
    gap: 6px;
    padding: 8px;
  }

  #sendButton {
    padding: 10px 12px;
  }

  .attach-button {
    padding: 9px 10px;
  }

  #emojiGrid {
    grid-template-columns: repeat(7, minmax(0, 1fr));
  }
}
</style>
</head>

<body>

<main class="container">

<header>
  <div class="top">
    <a href="dashboard.html" class="back"
       aria-label="Back to dashboard">‹</a>
    <h1 id="pageTitle">My Messages</h1>
  </div>

  <p class="subtitle" id="pageSubtitle">
    Select an accepted contact to start chatting.
  </p>
</header>

<div id="status" role="status">
  Connecting to SIMPLEXPING...
</div>

<section id="contactList"></section>

<section id="chatScreen">

  <div class="chat-header">
    <button type="button" id="backToContacts">‹</button>

    <div class="avatar" id="chatAvatar">?</div>

    <div>
      <h3 id="chatName">Contact</h3>
      <p>SIMPLEXPING member</p>
    </div>
  </div>

  <div id="messages">
    <p class="empty">Your conversation will appear here.</p>
  </div>

  <!-- Reply preview -->
  <div id="replyPreview" hidden>
    <div class="reply-preview-content">
      <span id="replyPreviewName">Replying to message</span>
      <span id="replyPreviewText"></span>
    </div>
    <button type="button" id="cancelReply"
            aria-label="Cancel reply">✕</button>
  </div>

  <!-- Emoji picker -->
  <div id="emojiPicker" hidden>
    <p id="emojiPickerTitle">Choose an emoji</p>
    <div id="emojiGrid"></div>
  </div>

  <div id="attachmentButtons" hidden>
    <button type="button" class="attach-button" id="photoButton">
      🖼️ Photo
    </button>

    <button type="button" class="attach-button" id="audioButton">
      🎵 Audio
    </button>

    <button type="button" class="attach-button" id="videoButton">
      🎬 Video
    </button>
  </div>

  <p id="mediaHelp" hidden>
    Photos: up to 5 MB. Audio: up to 10 MB.
    Videos: up to 20 MB.
  </p>

  <input type="file" id="photoInput"
         accept="image/jpeg,image/png,image/webp" hidden>

  <input type="file" id="audioInput"
         accept="audio/*,.m4a,.mp3,.wav,.webm,.ogg" hidden>

  <input type="file" id="videoInput"
         accept="video/*" hidden>

  <form id="messageForm" hidden>
    <button type="button" id="emojiToggle"
            aria-label="Choose emoji"
            aria-expanded="false">😊</button>

    <input type="text" id="messageInput"
           placeholder="Write a message..."
           maxlength="2000" autocomplete="off"
           enterkeyhint="send">

    <button type="submit" id="sendButton">Send</button>
  </form>

</section>
</main>

<div id="photoViewer" hidden>
  <button type="button" id="closePhotoViewer"
          aria-label="Close photo">✕</button>

  <img id="enlargedPhoto" alt="Enlarged picture">

  <p id="enlargedPhotoName"></p>
</div>

<!-- JavaScript will follow in Parts 2–4. -->

<script type="module">
import { auth, db } from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

import {
  doc,
  getDoc,
  getDocs,
  setDoc,
  collection,
  addDoc,
  query,
  where,
  orderBy,
  limit,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const CLOUDINARY_CLOUD_NAME = "ewzaj6yw";
const CLOUDINARY_UPLOAD_PRESET = "simplexping_chat_media";

const contactList = document.getElementById("contactList");
const chatScreen = document.getElementById("chatScreen");
const messagesContainer = document.getElementById("messages");
const messageForm = document.getElementById("messageForm");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const statusElement = document.getElementById("status");

const replyPreview = document.getElementById("replyPreview");
const replyPreviewName = document.getElementById("replyPreviewName");
const replyPreviewText = document.getElementById("replyPreviewText");
const cancelReplyButton = document.getElementById("cancelReply");

const emojiToggle = document.getElementById("emojiToggle");
const emojiPicker = document.getElementById("emojiPicker");
const emojiGrid = document.getElementById("emojiGrid");

let currentUser = null;
let currentContact = null;
let currentConversationId = null;
let messagesUnsubscribe = null;
let contactsUnsubscribe = null;
let selectedReply = null;
let isSending = false;

const EMOJIS = [
  "😀", "😃", "😄", "😁", "😆", "😅", "😂", "🤣",
  "😊", "😇", "🙂", "🙃", "😉", "😍", "🥰", "😘",
  "😋", "😎", "🤩", "🥳", "😭", "😢", "🥹", "😡",
  "🤔", "🤗", "🤭", "🤫", "😴", "🙏", "👏", "👍",
  "👎", "❤️", "💕", "💖", "💯", "🔥", "🎉", "✨",
  "✅", "💪", "🤝", "👋", "💐", "🌹", "❤️‍🔥", "💔",
  "😮", "😱", "🤦", "🤷", "🙌", "👌", "✌️", "🫶",
  "💙", "💚", "💛", "🧡", "💜", "🤍", "🖤", "💗"
];

function showStatus(message, isError = false) {
  if (!statusElement) return;

  statusElement.textContent = message;
  statusElement.style.color = isError ? "#d93025" : "";
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => {
    const replacements = {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    };

    return replacements[character];
  });
}

function formatTime(timestamp) {
  if (!timestamp || typeof timestamp.toDate !== "function") {
    return "";
  }

  return timestamp.toDate().toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });
}

function stopChatListener() {
  if (typeof messagesUnsubscribe === "function") {
    messagesUnsubscribe();
  }

  messagesUnsubscribe = null;
}

function closeEmojiPicker() {
  if (emojiPicker) {
    emojiPicker.hidden = true;
  }
}

function renderEmojiPicker() {
  if (!emojiGrid) return;

  emojiGrid.replaceChildren();

  EMOJIS.forEach(emoji => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "emoji-button";
    button.textContent = emoji;
    button.setAttribute("aria-label", emoji);

    button.addEventListener("click", () => {
      const start = messageInput.selectionStart ?? messageInput.value.length;
      const end = messageInput.selectionEnd ?? start;
      const before = messageInput.value.slice(0, start);
      const after = messageInput.value.slice(end);

      messageInput.value = before + emoji + after;

      const cursorPosition = start + emoji.length;
      messageInput.focus();
      messageInput.setSelectionRange(cursorPosition, cursorPosition);

      messageInput.dispatchEvent(
        new Event("input", { bubbles: true })
      );
    });

    emojiGrid.appendChild(button);
  });
}

if (emojiToggle && emojiPicker) {
  emojiToggle.addEventListener("click", () => {
    emojiPicker.hidden = !emojiPicker.hidden;

    if (!emojiPicker.hidden) {
      renderEmojiPicker();
    }
  });
}

if (cancelReplyButton) {
  cancelReplyButton.addEventListener("click", clearReply);
}

function getMessagePreviewText(message) {
  if (!message) return "Message";

  const type = message.type || "text";

  if (type === "image") return "📷 Photo";
  if (type === "audio") return "🎤 Audio message";
  if (type === "video") return "🎬 Video";
  if (type === "text") {
    return message.text || "Message";
  }

  return "Message";
}

function setReply(messageId, message) {
  if (!messageId || !message || !currentConversationId) {
    return;
  }

  selectedReply = {
    messageId,
    senderId: message.senderId || "",
    senderName:
      message.senderId === currentUser?.uid
        ? "You"
        : (currentContact?.fullName || "Contact"),
    type: message.type || "text",
    text: getMessagePreviewText(message)
  };

  if (replyPreviewName) {
    replyPreviewName.textContent =
      "Replying to " + selectedReply.senderName;
  }

  if (replyPreviewText) {
    replyPreviewText.textContent = selectedReply.text;
  }

  if (replyPreview) {
    replyPreview.hidden = false;
  }

  closeEmojiPicker();
  messageInput.focus();
}

function clearReply() {
  selectedReply = null;

  if (replyPreview) {
    replyPreview.hidden = true;
  }

  if (replyPreviewName) {
    replyPreviewName.textContent = "Replying to message";
  }

  if (replyPreviewText) {
    replyPreviewText.textContent = "";
  }
}

function renderMessage(messageId, message) {
  const wrapper = document.createElement("div");
  wrapper.className =
    "message " +
    (message.senderId === currentUser.uid ? "sent" : "received");

  wrapper.dataset.messageId = messageId;

  const bubble = document.createElement("div");
  bubble.className = "message-bubble";

  if (message.replyTo && typeof message.replyTo === "object") {
    const quote = document.createElement("div");
    quote.className = "reply-quote";

    const quoteSender = document.createElement("div");
    quoteSender.className = "reply-quote-name";
    quoteSender.textContent =
      message.replyTo.senderId === currentUser.uid
        ? "You"
        : (message.replyTo.senderName || currentContact?.fullName || "Contact");

    const quoteText = document.createElement("div");
    quoteText.className = "reply-quote-text";
    quoteText.textContent =
      message.replyTo.text || "Original message";

    quote.append(quoteSender, quoteText);
    bubble.appendChild(quote);
  }

  const type = message.type || "text";

  if (type === "image" && message.mediaUrl) {
    const image = document.createElement("img");
    image.src = message.mediaUrl;
    image.alt = message.text || "Shared photo";
    image.loading = "lazy";
    image.className = "message-media";

    image.addEventListener("click", () => {
      const viewer = document.getElementById("photoViewer");
      const viewerImage = document.getElementById("photoViewerImage");

      if (viewer && viewerImage) {
        viewerImage.src = message.mediaUrl;
        viewer.hidden = false;
      } else {
        window.open(message.mediaUrl, "_blank", "noopener");
      }
    });

    bubble.appendChild(image);

    if (message.text) {
      const caption = document.createElement("div");
      caption.className = "message-text";
      caption.textContent = message.text;
      bubble.appendChild(caption);
    }
  } else if (type === "video" && message.mediaUrl) {
    const video = document.createElement("video");
    video.src = message.mediaUrl;
    video.controls = true;
    video.preload = "metadata";
    video.className = "message-media";
    bubble.appendChild(video);

    if (message.text) {
      const caption = document.createElement("div");
      caption.className = "message-text";
      caption.textContent = message.text;
      bubble.appendChild(caption);
    }
  } else if (type === "audio" && message.mediaUrl) {
    const audio = document.createElement("audio");
    audio.src = message.mediaUrl;
    audio.controls = true;
    audio.preload = "metadata";
    bubble.appendChild(audio);

    if (message.text) {
      const caption = document.createElement("div");
      caption.className = "message-text";
      caption.textContent = message.text;
      bubble.appendChild(caption);
    }
  } else {
    const text = document.createElement("div");
    text.className = "message-text";
    text.textContent = message.text || "";
    bubble.appendChild(text);
  }

  const footer = document.createElement("div");
  footer.className = "message-footer";

  const time = document.createElement("span");
  time.className = "message-time";
  time.textContent = formatTime(message.createdAt);

  const replyButton = document.createElement("button");
  replyButton.type = "button";
  replyButton.className = "reply-message-button";
  replyButton.textContent = "Reply";
  replyButton.addEventListener("click", () => {
    setReply(messageId, message);
  });

  footer.append(time, replyButton);
  bubble.appendChild(footer);
  wrapper.appendChild(bubble);

  return wrapper;
}

function renderMessages(snapshot) {
  if (!messagesContainer) return;

  messagesContainer.replaceChildren();

  snapshot.forEach(messageDocument => {
    messagesContainer.appendChild(
      renderMessage(messageDocument.id, messageDocument.data())
    );
  });

  messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

function conversationIdFor(uidA, uidB) {
  return [uidA, uidB].sort().join("_");
}

async function getUserProfile(uid) {
  const profileSnapshot = await getDoc(doc(db, "users", uid));

  if (!profileSnapshot.exists()) {
    return null;
  }

  return {
    uid,
    ...profileSnapshot.data()
  };
}

function getContactDisplayName(contact) {
  return contact?.fullName || contact?.displayName || contact?.email || "Contact";
}

async function openChat(uid) {
  if (!currentUser || !uid || uid === currentUser.uid) {
    return;
  }

  showStatus("");

  try {
    const contact = await getUserProfile(uid);

    if (!contact) {
      showStatus("This contact's profile could not be found.", true);
      return;
    }

    currentContact = contact;
    currentConversationId = conversationIdFor(currentUser.uid, uid);

    stopChatListener();
    clearReply();
    closeEmojiPicker();

    const conversationRef = doc(
      db,
      "conversations",
      currentConversationId
    );

    await setDoc(
      conversationRef,
      {
        participants: [currentUser.uid, uid].sort(),
        updatedAt: serverTimestamp()
      },
      { merge: true }
    );

    const chatTitle = document.getElementById("chatName");
    if (chatTitle) {
      chatTitle.textContent = getContactDisplayName(contact);
    }

    if (contactList) {
      contactList.hidden = true;
    }

    if (chatScreen) {
      chatScreen.hidden = false;
    }

    if (messagesContainer) {
      messagesContainer.replaceChildren();
    }

    const messagesQuery = query(
      collection(
        db,
        "conversations",
        currentConversationId,
        "messages"
      ),
      orderBy("createdAt", "asc"),
      limit(100)
    );

    messagesUnsubscribe = onSnapshot(
      messagesQuery,
      snapshot => {
        renderMessages(snapshot);
      },
      error => {
        console.error("Message listener error:", error);
        showStatus("Unable to load messages. Check Firestore rules.", true);
      }
    );

    if (messageInput) {
      messageInput.focus();
    }
  } catch (error) {
    console.error("Unable to open chat:", error);
    showStatus(
      "Could not open this chat. Check your contact access and Firestore rules.",
      true
    );
  }
}

function renderContactButton(contact) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "contact-item";

  const name = document.createElement("span");
  name.className = "contact-name";
  name.textContent = getContactDisplayName(contact);

  button.appendChild(name);

  if (contact.photoURL || contact.photoUrl || contact.profilePhoto) {
    const photo = document.createElement("img");
    photo.className = "contact-avatar";
    photo.alt = "";
    photo.src =
      contact.photoURL || contact.photoUrl || contact.profilePhoto;
    button.prepend(photo);
  }

  button.addEventListener("click", () => {
    openChat(contact.uid);
  });

  return button;
}

async function loadContacts() {
  if (!currentUser || !contactList) {
    return;
  }

  contactList.replaceChildren();

  try {
    /*
      Contact documents must be available to this user.
      The code supports a contacts collection containing documents
      with contactUid, uid, or userId fields.
    */
    const contactsSnapshot = await getDocs(
      collection(db, "contacts")
    );

    const contactIds = new Set();

    contactsSnapshot.forEach(contactDocument => {
      const data = contactDocument.data();

      if (
        data.ownerUid === currentUser.uid ||
        data.userId === currentUser.uid ||
        data.uid === currentUser.uid
      ) {
        const otherUid =
          data.contactUid ||
          data.contactId ||
          data.otherUid ||
          data.friendUid;

        if (otherUid && otherUid !== currentUser.uid) {
          contactIds.add(otherUid);
        }
      }

      if (
        data.ownerUid !== currentUser.uid &&
        data.userId !== currentUser.uid &&
        data.uid !== currentUser.uid
      ) {
        const possibleOwner =
          data.ownerUid || data.userId || data.uid;

        const possibleContact =
          data.contactUid ||
          data.contactId ||
          data.otherUid ||
          data.friendUid;

        if (
          possibleOwner &&
          possibleContact === currentUser.uid &&
          possibleOwner !== currentUser.uid
        ) {
          contactIds.add(possibleOwner);
        }
      }
    });

    if (contactIds.size === 0) {
      const emptyMessage = document.createElement("p");
      emptyMessage.textContent =
        "No contacts found yet. Add or accept a contact first.";
      contactList.appendChild(emptyMessage);
      return;
    }

    for (const uid of contactIds) {
      try {
        const profile = await getUserProfile(uid);

        if (profile) {
          contactList.appendChild(renderContactButton(profile));
        }
      } catch (profileError) {
        console.error("Unable to load contact profile:", profileError);
      }
    }

    if (!contactList.children.length) {
      const emptyMessage = document.createElement("p");
      emptyMessage.textContent = "No available contacts to display.";
      contactList.appendChild(emptyMessage);
    }
  } catch (error) {
    console.error("Unable to load contacts:", error);
    showStatus(
      "Unable to load contacts. Your contacts structure or Firestore rules may differ.",
      true
    );
  }
}

async function sendTextMessage() {
  if (!currentUser || !currentConversationId || !currentContact) {
    showStatus("Open a chat before sending a message.", true);
    return;
  }

  const text = messageInput.value.trim();

  if (!text) {
    return;
  }

  if (isSending) {
    return;
  }

  isSending = true;
  sendButton.disabled = true;
  showStatus("Sending...");

  try {
    const messageData = {
      text,
      type: "text",
      senderId: currentUser.uid,
      createdAt: serverTimestamp()
    };

    if (selectedReply) {
      messageData.replyTo = {
        messageId: selectedReply.messageId,
        senderId: selectedReply.senderId,
        senderName: selectedReply.senderName,
        type: selectedReply.type,
        text: selectedReply.text
      };
    }

    await addDoc(
      collection(
        db,
        "conversations",
        currentConversationId,
        "messages"
      ),
      messageData
    );

    messageInput.value = "";
    clearReply();
    closeEmojiPicker();
    showStatus("");
  } catch (error) {
    console.error("Unable to send text message:", error);
    showStatus(
      "Message failed to send. Check your Firestore message rules.",
      true
    );
  } finally {
    isSending = false;
    sendButton.disabled = false;
  }
}

if (messageForm) {
  messageForm.addEventListener("submit", async event => {
    event.preventDefault();
    await sendTextMessage();
  });
}

async function uploadChatMedia(file, type, caption = "") {
  if (!currentUser || !currentConversationId || !currentContact) {
    showStatus("Open a chat before sending media.", true);
    return;
  }

  if (!file) {
    return;
  }

  if (!["image", "audio", "video"].includes(type)) {
    showStatus("Unsupported media type.", true);
    return;
  }

  if (isSending) {
    return;
  }

  isSending = true;
  if (sendButton) {
    sendButton.disabled = true;
  }

  showStatus("Uploading media...");

  try {
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

    const response = await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`,
      {
        method: "POST",
        body: formData
      }
    );

    const uploadResult = await response.json();

    if (!response.ok || !uploadResult.secure_url) {
      throw new Error(
        uploadResult.error?.message || "Cloudinary upload failed."
      );
    }

    const messageData = {
      text: caption.trim(),
      type,
      mediaUrl: uploadResult.secure_url,
      fileName: file.name || "",
      fileSize: file.size || 0,
      senderId: currentUser.uid,
      createdAt: serverTimestamp()
    };

    if (selectedReply) {
      messageData.replyTo = {
        messageId: selectedReply.messageId,
        senderId: selectedReply.senderId,
        senderName: selectedReply.senderName,
        type: selectedReply.type,
        text: selectedReply.text
      };
    }

    await addDoc(
      collection(
        db,
        "conversations",
        currentConversationId,
        "messages"
      ),
      messageData
    );

    clearReply();
    closeEmojiPicker();
    showStatus("");
  } catch (error) {
    console.error("Unable to upload or send media:", error);
    showStatus(
      "Media failed to send. Check Cloudinary settings and Firestore rules.",
      true
    );
  } finally {
    isSending = false;
    if (sendButton) {
      sendButton.disabled = false;
    }
  }
  }
      
function connectMediaInput(inputId, type) {
  const input = document.getElementById(inputId);

  if (!input) {
    console.warn("Media input not found:", inputId);
    return;
  }

  input.addEventListener("change", async () => {
    const file = input.files?.[0];

    if (!file) {
      return;
    }

    try {
      await uploadChatMedia(file, type);
    } finally {
      input.value = "";
    }
  });
}

connectMediaInput("imageInput", "image");
connectMediaInput("audioInput", "audio");
connectMediaInput("videoInput", "video");

function connectFileButton(buttonId, inputId) {
  const button = document.getElementById(buttonId);
  const input = document.getElementById(inputId);

  if (!button || !input) {
    console.warn("File button or input not found:", buttonId, inputId);
    return;
  }

  button.addEventListener("click", () => {
    input.click();
  });
}

connectFileButton("sendPhotoButton", "imageInput");
connectFileButton("sendAudioButton", "audioInput");
connectFileButton("sendVideoButton", "videoInput");

const backButton =
  document.getElementById("backButton") ||
  document.getElementById("backToContacts");

if (backButton) {
  backButton.addEventListener("click", () => {
    stopChatListener();
    clearReply();
    closeEmojiPicker();

    currentContact = null;
    currentConversationId = null;

    if (chatScreen) {
      chatScreen.hidden = true;
    }

    if (contactList) {
      contactList.hidden = false;
    }

    showStatus("");
  });
}

const photoViewer = document.getElementById("photoViewer");
const closePhotoViewerButton =
  document.getElementById("closePhotoViewer");

if (closePhotoViewerButton && photoViewer) {
  closePhotoViewerButton.addEventListener("click", () => {
    photoViewer.hidden = true;

    const viewerImage =
      document.getElementById("photoViewerImage");

    if (viewerImage) {
      viewerImage.src = "";
    }
  });
}

if (photoViewer) {
  photoViewer.addEventListener("click", event => {
    if (event.target === photoViewer) {
      photoViewer.hidden = true;

      const viewerImage =
        document.getElementById("photoViewerImage");

      if (viewerImage) {
        viewerImage.src = "";
      }
    }
  });
}

onAuthStateChanged(auth, async user => {
  stopChatListener();

  currentUser = user || null;
  currentContact = null;
  currentConversationId = null;

  clearReply();
  closeEmojiPicker();

  if (!user) {
    if (chatScreen) {
      chatScreen.hidden = true;
    }

    if (contactList) {
      contactList.replaceChildren();

      const signInMessage = document.createElement("p");
      signInMessage.textContent =
        "Please sign in to use SIMPLEXPING.";
      contactList.appendChild(signInMessage);
      contactList.hidden = false;
    }

    showStatus("");
    return;
  }

  showStatus("Loading contacts...");

  await loadContacts();

  showStatus("");
});
</script>
