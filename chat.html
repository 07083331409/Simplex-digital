<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#091426">
<title>SIMPLEXPING | Messages</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #091426;
  color: #f1f5fb;
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 850px;
  min-height: 100vh;
  margin: auto;
  background: #101f35;
  display: flex;
  flex-direction: column;
}

header {
  padding: 18px;
  background: #142640;
  border-bottom: 1px solid #263b56;
}

.top {
  display: flex;
  align-items: center;
  gap: 12px;
}

.back {
  color: #a9c6ec;
  text-decoration: none;
  font-size: 27px;
}

h1 {
  font-size: 22px;
  margin: 0;
}

.subtitle {
  color: #91a9c6;
  font-size: 14px;
  margin: 10px 0 0;
}

#status {
  padding: 12px;
  text-align: center;
  font-size: 13px;
  color: #a9c6ec;
  overflow-wrap: anywhere;
}

#contactList {
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.contact {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: #172b45;
  border: 1px solid #29415f;
  border-radius: 12px;
}

.avatar {
  position: relative;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #28518a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 18px;
  flex-shrink: 0;
  overflow: hidden;
}

.avatar img {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}

.has-photo {
  cursor: pointer;
}

.contact-info {
  flex: 1;
  min-width: 0;
}

.contact-info h3,
.chat-header h3 {
  margin: 0;
  font-size: 15px;
  overflow-wrap: anywhere;
}

.contact-info p,
.chat-header p {
  color: #91a9c6;
  font-size: 12px;
  margin: 5px 0 0;
}

button {
  border: 0;
  border-radius: 22px;
  background: #3978c7;
  color: white;
  font-weight: bold;
  padding: 11px 16px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: wait;
}

.empty {
  text-align: center;
  color: #91a9c6;
  padding: 25px 15px;
  line-height: 1.7;
}

.empty a {
  color: #8fc2ff;
  display: inline-block;
  margin-top: 12px;
}

#chatScreen {
  display: none;
  flex: 1;
  min-height: 0;
  flex-direction: column;
}

.chat-header {
  padding: 13px 16px;
  background: #142640;
  border-bottom: 1px solid #263b56;
  display: flex;
  align-items: center;
  gap: 12px;
}

.chat-header .avatar {
  width: 40px;
  height: 40px;
}

#messages {
  flex: 1;
  min-height: 250px;
  padding: 15px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.message {
  max-width: min(88%, calc(100% - 38px));
  padding: 12px 15px;
  border-radius: 15px;
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.message-row {
  width: 100%;
  display: flex;
  align-items: flex-end;
  gap: 8px;
}

.message-row.sent {
  flex-direction: row-reverse;
  justify-content: flex-end;
}

.message-row.received {
  justify-content: flex-start;
}

.message-avatar {
  position: relative;
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 1px solid #49617f;
  border-radius: 50%;
  background: #28518a;
  color: white;
  font-size: 11px;
  font-weight: bold;
}

.message-avatar img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}

.message:active {
  filter: brightness(1.15);
}

.sent {
  background: #285b9b;
  border-bottom-right-radius: 4px;
}

.received {
  background: #20344f;
  border-bottom-left-radius: 4px;
}

.message-time {
  display: block;
  font-size: 10px;
  color: #c1d0e4;
  margin-top: 7px;
  text-align: right;
}

.message-actions {
  display: flex;
  justify-content: flex-end;
  gap: 5px;
  margin-top: 7px;
}

.message-action {
  padding: 3px 6px;
  border-radius: 4px;
  background: transparent;
  color: #c1d0e4;
  font-size: 11px;
  font-weight: normal;
}

.message-action:hover {
  background: rgba(255, 255, 255, .1);
}

.message-edited {
  display: block;
  margin-top: 5px;
  color: #c1d0e4;
  font-size: 10px;
  text-align: right;
}

.message-edit-form {
  display: grid;
  gap: 7px;
  min-width: min(250px, 70vw);
}

.message-edit-input {
  width: 100%;
  min-height: 76px;
  padding: 8px;
  border: 1px solid #7899bd;
  border-radius: 6px;
  background: #0b1a2e;
  color: white;
  font: inherit;
  resize: vertical;
}

.message-edit-controls {
  display: flex;
  justify-content: flex-end;
  gap: 7px;
}

.message-edit-controls button {
  padding: 7px 10px;
  border-radius: 6px;
  font-size: 12px;
}

.message-edit-cancel {
  background: #304965;
}

.message-image,
.message-video {
  display: block;
  max-width: 100%;
  max-height: 350px;
  width: auto;
  height: auto;
  border-radius: 9px;
  object-fit: contain;
}

.message-image {
  cursor: pointer;
}

.message-video {
  width: 280px;
  max-width: 100%;
}

.message-audio {
  display: block;
  width: 270px;
  max-width: 100%;
  margin-top: 5px;
}

.message-caption {
  margin-bottom: 8px;
}

.reply-quote {
  display: block;
  padding: 7px 9px;
  margin-bottom: 8px;
  border-left: 3px solid #8fc2ff;
  border-radius: 5px;
  background: rgba(0, 0, 0, .16);
  cursor: pointer;
  overflow-wrap: anywhere;
}

.reply-quote-name {
  display: block;
  color: #a9d2ff;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 3px;
}

.reply-quote-text {
  display: block;
  font-size: 12px;
  white-space: pre-wrap;
}

#replyPreview {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 10px 13px;
  background: #10213a;
  border-top: 1px solid #304965;
}

#replyPreviewContent {
  flex: 1;
  min-width: 0;
  border-left: 3px solid #60a5fa;
  padding-left: 9px;
}

#replyPreviewName {
  color: #8fc2ff;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 4px;
}

#replyPreviewText {
  color: #d8e5f5;
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#cancelReplyButton {
  background: transparent;
  color: #d8e5f5;
  font-size: 20px;
  padding: 5px 10px;
}

#emojiPicker {
  display: none;
  padding: 10px;
  background: #10213a;
  border-top: 1px solid #304965;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  gap: 5px;
  max-height: 180px;
  overflow-y: auto;
}

.emoji-choice {
  padding: 7px 0;
  background: #20344f;
  border-radius: 9px;
  font-size: 23px;
  line-height: 1.2;
}

#messageForm {
  display: flex;
  gap: 8px;
  padding: 12px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: #142640;
  border-top: 1px solid #263b56;
  align-items: center;
}

#messageInput {
  flex: 1;
  min-width: 0;
  height: 46px;
  padding: 0 15px;
  border: 1px solid #304965;
  border-radius: 25px;
  outline: none;
  background: #0b1a2e;
  color: white;
  font-size: 16px;
}

#messageInput::placeholder {
  color: #91a9c6;
}

#emojiButton {
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  padding: 0;
  background: #203d60;
  border: 1px solid #355579;
  font-size: 23px;
}

#attachmentButtons {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  padding: 10px 12px;
  background: #142640;
  align-items: center;
}

.attach-button {
  padding: 9px 13px;
  font-size: 13px;
  background: #203d60;
  border: 1px solid #355579;
  white-space: nowrap;
}

#mediaHelp {
  color: #91a9c6;
  font-size: 11px;
  padding: 0 13px 10px;
  background: #142640;
  line-height: 1.5;
}

#photoViewer {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  padding: 65px 18px 28px;
  background: rgba(0, 0, 0, .94);
}

[hidden],
#photoViewer[hidden] {
  display: none !important;
}

#closePhotoViewer {
  position: absolute;
  top: max(16px, env(safe-area-inset-top));
  right: 16px;
  width: 44px;
  height: 44px;
  padding: 0;
  font-size: 22px;
  background: #263b56;
}

#enlargedPhoto {
  max-width: 100%;
  max-height: 75vh;
  max-height: 75dvh;
  object-fit: contain;
  border-radius: 8px;
}

#enlargedPhotoName {
  color: white;
  font-size: 16px;
  text-align: center;
  overflow-wrap: anywhere;
}

@media (min-width: 600px) {
  .container {
    min-height: 90vh;
    max-height: 900px;
    margin-top: 5vh;
    border-radius: 16px;
    overflow: hidden;
  }
}

@media (max-width: 380px) {
  #messageForm {
    gap: 5px;
    padding: 8px;
  }

  #sendButton {
    padding: 10px 12px;
  }

  #emojiButton {
    width: 40px;
    height: 40px;
  }

  .attach-button {
    padding: 9px 10px;
  }

  #emojiPicker {
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }
}
</style>
</head>

<body>

<main class="container">

<header>
  <div class="top">
    <a href="dashboard.html" class="back"
       aria-label="Back to dashboard">‹</a>
    <h1 id="pageTitle">My Messages</h1>
  </div>

  <p class="subtitle" id="pageSubtitle">
    Select an accepted contact to start chatting.
  </p>
</header>

<div id="status" role="status">
  Connecting to SIMPLEXPING...
</div>

<section id="contactList"></section>

<section id="chatScreen">

  <div class="chat-header">
    <button type="button" id="backToContacts">‹</button>

    <div class="avatar" id="chatAvatar">?</div>

    <div>
      <h3 id="chatName">Contact</h3>
      <p>SIMPLEXPING member</p>
    </div>
  </div>

  <div id="messages">
    <p class="empty">Your conversation will appear here.</p>
  </div>

  <div id="attachmentButtons" hidden>
    <button type="button" class="attach-button" id="photoButton">
      🖼️ Photo
    </button>

    <button type="button" class="attach-button" id="audioButton">
      🎵 Audio
    </button>

    <button type="button" class="attach-button" id="videoButton">
      🎬 Video
    </button>
  </div>

  <p id="mediaHelp" hidden>
    Photos: up to 5 MB. Audio: up to 10 MB.
    Videos: up to 20 MB.
  </p>

  <input type="file" id="photoInput"
         accept="image/jpeg,image/png,image/webp" hidden>

  <input type="file" id="audioInput"
         accept="audio/*,.m4a,.mp3,.wav,.webm,.ogg,.amr" hidden>

  <input type="file" id="videoInput"
         accept="video/*" hidden>

  <div id="replyPreview" aria-live="polite">
    <div id="replyPreviewContent">
      <div id="replyPreviewName">Replying to</div>
      <div id="replyPreviewText"></div>
    </div>

    <button type="button" id="cancelReplyButton"
            aria-label="Cancel reply">×</button>
  </div>

  <div id="emojiPicker" aria-label="Choose an emoji">
    <button type="button" class="emoji-choice" data-emoji="😀">😀</button>
    <button type="button" class="emoji-choice" data-emoji="😂">😂</button>
    <button type="button" class="emoji-choice" data-emoji="🥹">🥹</button>
    <button type="button" class="emoji-choice" data-emoji="😊">😊</button>
    <button type="button" class="emoji-choice" data-emoji="😍">😍</button>
    <button type="button" class="emoji-choice" data-emoji="🥰">🥰</button>
    <button type="button" class="emoji-choice" data-emoji="😘">😘</button>
    <button type="button" class="emoji-choice" data-emoji="😉">😉</button>
    <button type="button" class="emoji-choice" data-emoji="😎">😎</button>
    <button type="button" class="emoji-choice" data-emoji="😭">😭</button>
    <button type="button" class="emoji-choice" data-emoji="😢">😢</button>
    <button type="button" class="emoji-choice" data-emoji="😡">😡</button>
    <button type="button" class="emoji-choice" data-emoji="🤔">🤔</button>
    <button type="button" class="emoji-choice" data-emoji="🙏">🙏</button>
    <button type="button" class="emoji-choice" data-emoji="👏">👏</button>
    <button type="button" class="emoji-choice" data-emoji="👍">👍</button>
    <button type="button" class="emoji-choice" data-emoji="👎">👎</button>
    <button type="button" class="emoji-choice" data-emoji="❤️">❤️</button>
    <button type="button" class="emoji-choice" data-emoji="💕">💕</button>
    <button type="button" class="emoji-choice" data-emoji="💔">💔</button>
    <button type="button" class="emoji-choice" data-emoji="🔥">🔥</button>
    <button type="button" class="emoji-choice" data-emoji="🎉">🎉</button>
    <button type="button" class="emoji-choice" data-emoji="💯">💯</button>
    <button type="button" class="emoji-choice" data-emoji="💪">💪</button>
    <button type="button" class="emoji-choice" data-emoji="🤝">🤝</button>
    <button type="button" class="emoji-choice" data-emoji="👋">👋</button>
    <button type="button" class="emoji-choice" data-emoji="🥳">🥳</button>
    <button type="button" class="emoji-choice" data-emoji="😇">😇</button>
    <button type="button" class="emoji-choice" data-emoji="💖">💖</button>
    <button type="button" class="emoji-choice" data-emoji="✨">✨</button>
    <button type="button" class="emoji-choice" data-emoji="🙌">🙌</button>
  </div>

  <form id="messageForm" hidden>
    <button type="button" id="emojiButton"
            aria-label="Choose emoji" aria-expanded="false">😊</button>

    <input type="text" id="messageInput"
           placeholder="Write a message..."
           maxlength="2000" autocomplete="off"
           enterkeyhint="send">

    <button type="submit" id="sendButton">Send</button>
  </form>

</section>
</main>

<div id="photoViewer" hidden>
  <button type="button" id="closePhotoViewer"
          aria-label="Close photo">✕</button>

  <img id="enlargedPhoto" alt="Enlarged picture">

  <p id="enlargedPhotoName"></p>
</div>

<script type="module">

import { auth, db } from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

import {
  doc,
  getDoc,
  getDocs,
  setDoc,
  collection,
  addDoc,
  updateDoc,
  deleteDoc,
  query,
  where,
  orderBy,
  limit,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

/* Cloudinary configuration */
const CLOUD_NAME = "ewzaj6yw";
const CHAT_MEDIA_UPLOAD_PRESET = "simplexping_chat_media";

const MAX_PHOTO_SIZE = 5 * 1024 * 1024;
const MAX_AUDIO_SIZE = 10 * 1024 * 1024;
const MAX_VIDEO_SIZE = 20 * 1024 * 1024;

/* HTML elements */
const contactList = document.getElementById("contactList");
const chatScreen = document.getElementById("chatScreen");
const messagesBox = document.getElementById("messages");
const messageForm = document.getElementById("messageForm");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const statusText = document.getElementById("status");

const pageTitle = document.getElementById("pageTitle");
const pageSubtitle = document.getElementById("pageSubtitle");

const chatName = document.getElementById("chatName");
const chatAvatar = document.getElementById("chatAvatar");
const backToContactsButton =
  document.getElementById("backToContacts");

const attachmentButtons =
  document.getElementById("attachmentButtons");
const mediaHelp = document.getElementById("mediaHelp");

const photoButton = document.getElementById("photoButton");
const audioButton = document.getElementById("audioButton");
const videoButton = document.getElementById("videoButton");

const photoInput = document.getElementById("photoInput");
const audioInput = document.getElementById("audioInput");
const videoInput = document.getElementById("videoInput");

const photoViewer = document.getElementById("photoViewer");
const closePhotoViewerButton =
  document.getElementById("closePhotoViewer");
const enlargedPhoto = document.getElementById("enlargedPhoto");
const enlargedPhotoName =
  document.getElementById("enlargedPhotoName");

/* Reply controls */
const replyPreview = document.getElementById("replyPreview");
const replyPreviewName =
  document.getElementById("replyPreviewName");
const replyPreviewText =
  document.getElementById("replyPreviewText");
const cancelReplyButton =
  document.getElementById("cancelReplyButton");

/* Emoji controls */
const emojiPicker = document.getElementById("emojiPicker");
const emojiButton = document.getElementById("emojiButton");

/* Page and chat state */
const requestedUserId =
  new URLSearchParams(window.location.search).get("with");

let currentUser = null;
let conversationId = null;
let otherUserId = null;
let otherUserName = "Contact";

let stopMessagesListener = null;
let stopOwnProfileListener = null;
let contactProfileListeners = new Map();
let contactProfiles = new Map();
let expectedContactProfileIds = new Set();
let loadedContactProfileIds = new Set();
let currentUserProfile = {};
let currentMessageDocuments = [];
let sending = false;
let uploadingMedia = false;
let chatReady = false;

/* The message currently selected for replying to */
let selectedReply = null;

/* Show a status message */
function showStatus(message) {
  statusText.textContent = message;
  statusText.hidden = false;
}

/* Show an empty-state message safely */
function showEmpty(message) {
  messagesBox.replaceChildren();

  const paragraph = document.createElement("p");
  paragraph.className = "empty";
  paragraph.textContent = message;

  messagesBox.appendChild(paragraph);
}

/* Open the full-screen photo viewer */
function openPhoto(url, name = "Photo") {
  if (!url) return;

  enlargedPhoto.src = url;
  enlargedPhoto.alt = name;
  enlargedPhotoName.textContent = name;
  photoViewer.hidden = false;
}

/* Close and clear the photo viewer */
function closePhoto() {
  photoViewer.hidden = true;
  enlargedPhoto.removeAttribute("src");
  enlargedPhoto.alt = "Enlarged picture";
  enlargedPhotoName.textContent = "";
}

/* Display a user's avatar or initials */
function setAvatar(element, name, photoURL = "") {
  element.replaceChildren();

  const safeName =
    typeof name === "string" && name.trim()
      ? name.trim()
      : "User";

  element.textContent = getInitials(safeName);

  if (typeof photoURL === "string" && photoURL.trim()) {
    const image = document.createElement("img");

    image.src = photoURL;
    image.alt = safeName + " profile photo";
    image.loading = "lazy";

    image.addEventListener("error", () => {
      image.remove();
      element.classList.remove("has-photo");
    }, { once: true });

    element.appendChild(image);
    element.classList.add("has-photo");

    element.onclick = () => {
      if (image.isConnected && image.naturalWidth > 0) {
        openPhoto(photoURL, safeName);
      }
    };

    return;
  }

  element.classList.remove("has-photo");
  element.onclick = null;
}

function getInitials(name) {
  const parts = name.trim().split(/\s+/).filter(Boolean);
  return parts.length > 1
    ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
    : (parts[0]?.[0] || "U").toUpperCase();
}

function createMessageAvatar(name, photoURL = "") {
  const avatar = document.createElement("div");
  avatar.className = "message-avatar";
  avatar.textContent = getInitials(name);
  avatar.setAttribute("aria-label", name + " profile picture");

  if (typeof photoURL === "string" && photoURL.trim()) {
    const image = document.createElement("img");
    image.src = photoURL;
    image.alt = "";
    image.loading = "lazy";
    image.addEventListener("error", () => image.remove(), { once: true });
    avatar.appendChild(image);
  }

  return avatar;
}

function renderCurrentMessages() {
  if (!conversationId) return;

  messagesBox.replaceChildren();

  if (currentMessageDocuments.length === 0) {
    showEmpty(chatReady ? "No messages yet. Say hello!" : "Loading messages...");
    return;
  }

  currentMessageDocuments.forEach(renderMessage);
  messagesBox.scrollTop = messagesBox.scrollHeight;
}

/* Stop listening to the previous conversation */
function stopChatListener() {
  if (typeof stopMessagesListener === "function") {
    stopMessagesListener();
  }

  stopMessagesListener = null;
}

/* Build the same conversation ID for both participants */
function conversationIdFor(uidA, uidB) {
  return [uidA, uidB].sort().join("_");
}

/* Load accepted contacts */
async function loadContacts() {
  if (!currentUser) return;

  contactList.replaceChildren();
  showStatus("Loading your contacts...");

  try {
    const contactsQuery = query(
      collection(db, "contacts"),
      where("participants", "array-contains", currentUser.uid)
    );

    const contactsSnapshot = await getDocs(contactsQuery);
    const contactIds = new Set();

    contactsSnapshot.forEach((contactDocument) => {
      const data = contactDocument.data();
      const participants = data.participants;

      if (!Array.isArray(participants)) return;

      participants.forEach((uid) => {
        if (uid !== currentUser.uid) {
          contactIds.add(uid);
        }
      });
    });

    if (contactIds.size === 0) {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent =
        "You have no accepted contacts yet. Accept a contact request first.";
      contactList.appendChild(empty);
      showStatus("No accepted contacts found.");
      return;
    }

    syncContactProfileListeners(contactIds);

    if (contactIds.size === 0) {
      showEmpty("You have no accepted contacts yet. Accept a contact request first.");
      showStatus("No accepted contacts found.");
    } else {
      showEmpty("Loading contact profiles...");
      showStatus("Loading your contacts...");
    }
  } catch (error) {
    console.error("Error loading contacts:", error);
    showStatus("Could not load contacts. Please refresh and try again.");
  }
}

function renderContactList() {
  contactList.replaceChildren();

  const entries = Array.from(expectedContactProfileIds)
    .map(uid => ({ uid, profile: contactProfiles.get(uid) }))
    .filter(entry => entry.profile);

  entries.forEach(({ uid, profile }) => {
    const name =
      typeof profile.fullName === "string" && profile.fullName.trim()
        ? profile.fullName.trim()
        : "SIMPLEXPING member";

    const contact = document.createElement("div");
    contact.className = "contact";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    setAvatar(avatar, name, profile.photoURL || "");

    const info = document.createElement("div");
    info.className = "contact-info";

    const heading = document.createElement("h3");
    heading.textContent = name;

    const description = document.createElement("p");
    description.textContent = "Accepted contact";
    info.append(heading, description);

    const openButton = document.createElement("button");
    openButton.type = "button";
    openButton.textContent = "Message";
    openButton.addEventListener("click", () => openChat(uid));

    contact.append(avatar, info, openButton);
    contactList.appendChild(contact);
  });

  if (
    loadedContactProfileIds.size >= expectedContactProfileIds.size &&
    entries.length === 0 &&
    expectedContactProfileIds.size > 0
  ) {
    showEmpty("Contact profiles could not be loaded.");
    showStatus("Could not load contact profiles.");
  } else if (loadedContactProfileIds.size >= expectedContactProfileIds.size) {
    showStatus("Your accepted contacts are ready.");
  }
}

function syncContactProfileListeners(contactIds) {
  expectedContactProfileIds = new Set(contactIds);

  contactProfileListeners.forEach((stop, uid) => {
    if (!expectedContactProfileIds.has(uid)) {
      stop();
      contactProfileListeners.delete(uid);
      contactProfiles.delete(uid);
      loadedContactProfileIds.delete(uid);
    }
  });

  expectedContactProfileIds.forEach(uid => {
    if (contactProfileListeners.has(uid)) return;

    const stop = onSnapshot(
      doc(db, "users", uid),
      snapshot => {
        loadedContactProfileIds.add(uid);

        if (snapshot.exists()) {
          contactProfiles.set(uid, snapshot.data());
          updateChatHeader(uid, snapshot.data());
        } else {
          contactProfiles.delete(uid);
        }

        renderContactList();
        renderCurrentMessages();
      },
      error => {
        console.error("Contact profile listener error:", error);
        loadedContactProfileIds.add(uid);
        renderContactList();
      }
    );

    contactProfileListeners.set(uid, stop);
  });
}

function updateChatHeader(uid, profile) {
  if (uid !== otherUserId) return;

  otherUserName =
    typeof profile.fullName === "string" && profile.fullName.trim()
      ? profile.fullName.trim()
      : "SIMPLEXPING member";

  chatName.textContent = otherUserName;
  setAvatar(chatAvatar, otherUserName, profile.photoURL || "");
  pageSubtitle.textContent = "Chatting with " + otherUserName;
}

/* Confirm that the other person is an accepted contact */
async function checkAcceptedContact(uid) {
  if (!currentUser || !uid || uid === currentUser.uid) {
    return false;
  }

  const contactsQuery = query(
    collection(db, "contacts"),
    where("participants", "array-contains", currentUser.uid)
  );

  const contactsSnapshot = await getDocs(contactsQuery);

  return contactsSnapshot.docs.some((contactDocument) => {
    const data = contactDocument.data();

    return Array.isArray(data.participants) &&
      data.participants.includes(currentUser.uid) &&
      data.participants.includes(uid);
  });
}

/* Text shown when a message is quoted */
function getMessagePreview(data) {
  if (typeof data.text === "string" && data.text.trim()) {
    return data.text.trim().slice(0, 300);
  }

  if (data.type === "image") return "📷 Photo";
  if (data.type === "audio") return "🎵 Audio";
  if (data.type === "video") return "🎬 Video";

  return "Message";
}

/* Cancel the current reply */

/* Select a message and focus the reply input */
function selectMessageForReply(messageId, data) {
  if (!currentUser || !conversationId || !messageId || !data) {

/* Display a quoted message above a reply */
function createReplyQuote(replyTo) {
  if (!replyTo || typeof replyTo !== "object") {
    return null;
  }

  const quote = document.createElement("div");
  quote.className = "reply-quote";

  const name = document.createElement("span");
  name.className = "reply-quote-name";
  name.textContent =
    typeof replyTo.senderName === "string"
      ? replyTo.senderName
      : "Message";

  const text = document.createElement("span");
  text.className = "reply-quote-text";
  text.textContent =
    typeof replyTo.text === "string"
      ? replyTo.text
      : "Message";

  quote.append(name, text);

  return quote;
}

/* Render one message */
function renderMessage(messageDocument) {
  const data = messageDocument.data();
  const isSent = data.senderId === currentUser.uid;
  const isTextMessage = data.type === "text";
  const senderProfile = isSent
    ? currentUserProfile
    : contactProfiles.get(data.senderId) || {};
  const senderName = isSent
    ? senderProfile.fullName || currentUser.displayName || "You"
    : senderProfile.fullName || otherUserName;
  const senderPhotoURL = senderProfile.photoURL ||
    (isSent ? currentUser.photoURL : "") || "";

  const row = document.createElement("div");
  row.className = "message-row " + (isSent ? "sent" : "received");

  const bubble = document.createElement("div");
  bubble.className = "message " + (isSent ? "sent" : "received");
  bubble.dataset.messageId = messageDocument.id;

  if (data.replyTo) {
    const quote = createReplyQuote(data.replyTo);
    if (quote) bubble.appendChild(quote);
  }

  if (data.type === "image" && data.mediaUrl) {
    const image = document.createElement("img");
    image.className = "message-image";
    image.src = data.mediaUrl;
    image.alt = data.fileName || "Shared photo";
    image.loading = "lazy";

    image.addEventListener("click", (event) => {
      event.stopPropagation();
      openPhoto(data.mediaUrl, data.fileName || "Shared photo");
    });

    bubble.appendChild(image);

    if (typeof data.text === "string" && data.text.trim()) {
      const caption = document.createElement("div");
      caption.className = "message-caption";
      caption.textContent = data.text;
      bubble.insertBefore(caption, image);
    }
  } else if (data.type === "video" && data.mediaUrl) {
    const video = document.createElement("video");
    video.className = "message-video";
    video.src = data.mediaUrl;
    video.controls = true;
    video.preload = "metadata";
    video.playsInline = true;
    bubble.appendChild(video);

    if (typeof data.text === "string" && data.text.trim()) {
      const caption = document.createElement("div");
      caption.className = "message-caption";
      caption.textContent = data.text;
      bubble.insertBefore(caption, video);
    }
  } else if (data.type === "audio" && data.mediaUrl) {
    const audio = document.createElement("audio");
    audio.className = "message-audio";

    /*
     * Request MP3 delivery from Cloudinary for audio assets.
     * This helps browsers play formats such as AMR that they
     * may not support natively.
     */
    const mediaUrl = data.mediaUrl;

    audio.src = mediaUrl.includes("/video/upload/")
      ? mediaUrl.replace(
          "/video/upload/",
          "/video/upload/f_mp3/"
        )
      : mediaUrl;

    audio.controls = true;
    audio.preload = "metadata";
    bubble.appendChild(audio);

    if (typeof data.text === "string" && data.text.trim()) {
      const caption = document.createElement("div");
      caption.className = "message-caption";
      caption.textContent = data.text;
      bubble.insertBefore(caption, audio);
    }
  } else {
    const text = document.createElement("div");
    text.className = "message-body";
    text.textContent =
      typeof data.text === "string" ? data.text : "";
    bubble.appendChild(text);
  }

  if (data.edited === true && isTextMessage) {
    const edited = document.createElement("span");
    edited.className = "message-edited";
    edited.textContent = "Edited";
    bubble.appendChild(edited);
  }

  if (isSent) {
    const actions = document.createElement("div");
    actions.className = "message-actions";

    if (isTextMessage) {
      const editButton = document.createElement("button");
      editButton.type = "button";
      editButton.className = "message-action";
      editButton.textContent = "Edit";
      editButton.setAttribute("aria-label", "Edit sent message");
      editButton.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();

        if (data.senderId !== currentUser.uid) return;

        const body = bubble.querySelector(".message-body");
        if (!body) return;

        const editForm = document.createElement("form");
        editForm.className = "message-edit-form";

        const editInput = document.createElement("textarea");
        editInput.className = "message-edit-input";
        editInput.maxLength = 2000;
        editInput.setAttribute("aria-label", "Edit message text");
        editInput.value = typeof data.text === "string" ? data.text : "";

        const controls = document.createElement("div");
        controls.className = "message-edit-controls";

        const cancelButton = document.createElement("button");
        cancelButton.type = "button";
        cancelButton.className = "message-edit-cancel";
        cancelButton.textContent = "Cancel";

        const saveButton = document.createElement("button");
        saveButton.type = "submit";
        saveButton.textContent = "Save";

        cancelButton.addEventListener("click", (cancelEvent) => {
          cancelEvent.preventDefault();
          cancelEvent.stopPropagation();
          editForm.replaceWith(body);
        });

        editForm.addEventListener("click", (formEvent) => {
          formEvent.stopPropagation();
        });

        editForm.addEventListener("submit", async (submitEvent) => {
          submitEvent.preventDefault();
          submitEvent.stopPropagation();

          const updatedText = editInput.value.trim();

          if (!updatedText || updatedText.length > 2000) {
            showStatus("Edited messages must contain 1 to 2,000 characters.");
            return;
          }

          saveButton.disabled = true;
          cancelButton.disabled = true;

          try {
            await updateDoc(
              doc(db, "conversations", conversationId, "messages", messageDocument.id),
              {
                text: updatedText,
                edited: true,
                editedAt: serverTimestamp()
              }
            );
            statusText.hidden = true;
          } catch (error) {
            console.error("Could not edit message:", error);
            showStatus("Message not edited. Check your connection and Firestore rules.");
            saveButton.disabled = false;
            cancelButton.disabled = false;
          }
        });

        controls.append(cancelButton, saveButton);
        editForm.append(editInput, controls);
        body.replaceWith(editForm);
        editInput.focus();
        editInput.setSelectionRange(editInput.value.length, editInput.value.length);
      });

      actions.appendChild(editButton);
    }

    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.className = "message-action";
    deleteButton.textContent = "Delete";
    deleteButton.setAttribute("aria-label", "Delete sent message");
    deleteButton.addEventListener("click", async (event) => {
      event.preventDefault();
      event.stopPropagation();

      if (data.senderId !== currentUser.uid) return;
      if (!window.confirm("Delete this message for everyone in the conversation?")) {
        return;
      }

      deleteButton.disabled = true;

      try {
        await deleteDoc(
          doc(db, "conversations", conversationId, "messages", messageDocument.id)
        );
        statusText.hidden = true;
      } catch (error) {
        console.error("Could not delete message:", error);
        showStatus("Message not deleted. Check your connection and Firestore rules.");
        deleteButton.disabled = false;
      }
    });
    actions.appendChild(deleteButton);
    bubble.appendChild(actions);
  }

  if (data.createdAt && typeof data.createdAt.toDate === "function") {
    const time = document.createElement("span");
    time.className = "message-time";
    time.textContent = data.createdAt.toDate().toLocaleString([], {
      dateStyle: "short",
      timeStyle: "short"
    });
    bubble.appendChild(time);
  }

  bubble.addEventListener("click", (event) => {
    if (
      event.target.closest(
        "button, a, img, video, audio, .reply-quote"
      )
    ) {
      return;
    }

    selectMessageForReply(messageDocument.id, data);
  });

  row.append(
    createMessageAvatar(senderName, senderPhotoURL),
    bubble
  );
  messagesBox.appendChild(row);
}

/* Open a conversation with an accepted contact */
async function openChat(uid) {
  if (!currentUser || !uid || uid === currentUser.uid) return;

  stopChatListener();
  clearReply();

  chatReady = false;
  conversationId = null;
  otherUserId = uid;

  showStatus("Opening conversation...");

  try {
    const accepted = await checkAcceptedContact(uid);

    if (!accepted) {
      showStatus("You can only message an accepted contact.");
      return;
    }

    let profile = contactProfiles.get(uid);

    if (!profile) {
      const profileSnapshot = await getDoc(doc(db, "users", uid));

      if (!profileSnapshot.exists()) {
        showStatus("This contact's profile could not be found.");
        return;
      }

      profile = profileSnapshot.data();
      contactProfiles.set(uid, profile);
    }

    updateChatHeader(uid, profile);

    conversationId = conversationIdFor(currentUser.uid, uid);
    currentMessageDocuments = [];

    const members = [currentUser.uid, uid].sort();

    await setDoc(
      doc(db, "conversations", conversationId),
      {
        participants: members,
        updatedAt: serverTimestamp()
      },
      { merge: true }
    );

    contactList.style.display = "none";
    chatScreen.style.display = "flex";
    messageForm.hidden = false;
    attachmentButtons.hidden = false;
    mediaHelp.hidden = false;
    statusText.hidden = true;
    pageTitle.textContent = "Messages";
    pageSubtitle.textContent = "Chatting with " + otherUserName;

    showEmpty("Loading messages...");

    const messagesQuery = query(
      collection(db, "conversations", conversationId, "messages"),
      orderBy("createdAt", "asc"),
      limit(100)
    );

    stopMessagesListener = onSnapshot(
      messagesQuery,
      (snapshot) => {
        currentMessageDocuments = snapshot.docs;
        chatReady = true;
        renderCurrentMessages();
      },
      (error) => {
        console.error("Message listener error:", error);
        showStatus("Could not load messages. Check your connection and permissions.");
      }
    );
  } catch (error) {
    console.error("Could not open conversation:", error);
    showStatus("Could not open this conversation. Please try again.");
  }
}

/* Insert an emoji at the current cursor position */
function insertEmoji(emoji) {
  const input = messageInput;
  const start = input.selectionStart ?? input.value.length;
  const end = input.selectionEnd ?? input.value.length;

  const newValue =
    input.value.slice(0, start) +
    emoji +
    input.value.slice(end);

  if (newValue.length > 2000) {
    showStatus("Your message cannot exceed 2,000 characters.");
    return;
  }

  input.value = newValue;

  const cursorPosition = start + emoji.length;
  input.focus();
  input.setSelectionRange(cursorPosition, cursorPosition);
}

/* Upload media to Cloudinary */
async function uploadToCloudinary(file, type) {
  if (!file) {
    throw new Error("No file was selected.");
  }

  const resourceType = type === "image" ? "image" : "video";

  const uploadURL =
    `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`;

  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", CHAT_MEDIA_UPLOAD_PRESET);

  const response = await fetch(uploadURL, {
    method: "POST",
    body: formData
  });

  const result = await response.json();

  if (!response.ok || !result.secure_url) {
    console.error("Cloudinary upload failed:", result);
    throw new Error(
      result.error?.message || "The media upload failed."
    );
  }

  return result.secure_url;
}

/* Send an image, audio file, or video */
async function sendMedia(file, type) {
  if (!file || uploadingMedia) return;

  if (!currentUser || !conversationId || !chatReady) {
    showStatus("Please wait for the conversation to finish loading.");
    return;
  }

  let maximumSize;
  let expectedType;

  if (type === "image") {
    maximumSize = MAX_PHOTO_SIZE;
    expectedType = "image/";
  } else if (type === "audio") {
    maximumSize = MAX_AUDIO_SIZE;
    expectedType = "audio/";
  } else if (type === "video") {
    maximumSize = MAX_VIDEO_SIZE;
    expectedType = "video/";
  } else {
    showStatus("Unsupported media type.");
    return;
  }

  if (file.size > maximumSize) {
    const maximumMB = maximumSize / (1024 * 1024);
    showStatus(`This file is too large. The limit is ${maximumMB} MB.`);
    return;
  }

  const fileExtension = file.name.includes(".")
    ? file.name.split(".").pop().toLowerCase()
    : "";

  const allowedAudioExtensions = [
    "m4a", "mp3", "wav", "webm", "ogg", "amr"
  ];

  const audioExtensionAccepted =
    type === "audio" &&
    allowedAudioExtensions.includes(fileExtension);

  if (
    file.type &&
    !file.type.startsWith(expectedType) &&
    !audioExtensionAccepted
  ) {
    showStatus(`Please select a valid ${type} file.`);
    return;
  }

  uploadingMedia = true;
  photoButton.disabled = true;
  audioButton.disabled = true;
  videoButton.disabled = true;
  sendButton.disabled = true;

  showStatus(`Uploading ${type}... Please wait.`);

  try {
    const mediaUrl = await uploadToCloudinary(file, type);
    const caption = messageInput.value.trim();

    const messageData = {
      text: caption,
      type,
      mediaUrl,
      fileName: file.name,
      fileSize: file.size,
      senderId: currentUser.uid,
      createdAt: serverTimestamp()
    };

    if (selectedReply) {
      messageData.replyTo = {
        messageId: selectedReply.messageId,
        senderId: selectedReply.senderId,
        senderName: selectedReply.senderName,
        text: selectedReply.text,
        type: selectedReply.type
      };
    }

    await addDoc(
      collection(db, "conversations", conversationId, "messages"),
      messageData
    );

    messageInput.value = "";
    clearReply();
    emojiPicker.style.display = "none";
    emojiButton.setAttribute("aria-expanded", "false");
    statusText.hidden = true;
  } catch (error) {
    console.error("Could not send media:", error);
    showStatus(
      "Media not sent. Check your internet connection, Cloudinary preset, and Firestore rules."
    );
  } finally {
    uploadingMedia = false;
    photoButton.disabled = false;
    audioButton.disabled = false;
    videoButton.disabled = false;
    sendButton.disabled = false;
  }
}

    return;
  }

  try {
    stopOwnProfileListener = onSnapshot(
      doc(db, "users", user.uid),
      snapshot => {
        if (snapshot.exists()) {
          currentUserProfile = snapshot.data();
        }
        renderCurrentMessages();
      },
      error => {
        console.error("Current user profile listener error:", error);
      }
    );

    contactList.style.display = "flex";
    chatScreen.style.display = "none";
    messageForm.hidden = true;
    attachmentButtons.hidden = true;
    mediaHelp.hidden = true;

    await loadContacts();

    if (requestedUserId) {
      await openChat(requestedUserId);
    }
  } catch (error) {
    console.error("Page initialization failed:", error);
    showStatus("Could not initialize messages. Please refresh and try again.");
  }
});

</script>
</body>
</html>
