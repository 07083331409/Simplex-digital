
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#091426">
  <title>SIMPLEXPING | Messages</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #091426;
      color: #f1f5fb;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .container {
      width: 100%;
      max-width: 850px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: auto;
      background: #101f35;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      padding-top: max(18px, env(safe-area-inset-top));
      background: #142640;
      border-bottom: 1px solid #263b56;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back {
      color: #a9c6ec;
      text-decoration: none;
      font-size: 25px;
      padding: 4px;
    }

    h1 {
      font-size: 21px;
    }

    .subtitle {
      color: #91a9c6;
      font-size: 13px;
      margin-top: 7px;
    }

    #status {
      padding: 10px 16px;
      text-align: center;
      font-size: 12px;
      color: #a9c6ec;
    }

    #contactList {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .contact {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: #172b45;
      border: 1px solid #29415f;
      border-radius: 12px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #28518a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 50%;
    }

    .avatar.has-photo {
      cursor: pointer;
    }

    .avatar.has-photo:focus-visible {
      outline: 2px solid #8fc2ff;
      outline-offset: 3px;
    }

    .contact-info {
      flex: 1;
      min-width: 0;
    }

    .contact-info h3 {
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .contact-info p {
      color: #91a9c6;
      font-size: 12px;
      margin-top: 5px;
    }

    button {
      border: none;
      border-radius: 20px;
      background: #3978c7;
      color: white;
      font-weight: bold;
      padding: 11px 16px;
      cursor: pointer;
      flex-shrink: 0;
    }

    button:disabled {
      opacity: 0.5;
    }

    .empty {
      text-align: center;
      color: #91a9c6;
      padding: 35px 20px;
      line-height: 1.7;
    }

    .empty a {
      display: inline-block;
      margin-top: 15px;
      color: #8fc2ff;
      text-decoration: none;
    }

    #chatScreen {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
    }

    .chat-header {
      padding: 13px 16px;
      background: #142640;
      border-bottom: 1px solid #263b56;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header .avatar {
      width: 40px;
      height: 40px;
    }

    .chat-header h3 {
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .chat-header p {
      color: #91a9c6;
      font-size: 12px;
      margin-top: 4px;
    }

    #messages {
      flex: 1;
      min-height: 250px;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 100%;
    }

    .received-row {
      align-self: flex-start;
    }

    .message-avatar {
      width: 30px;
      height: 30px;
      font-size: 13px;
    }

    .message {
      max-width: 82%;
      padding: 12px 15px;
      border-radius: 15px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .received-row .message {
      max-width: calc(100% - 38px);
    }

    .sent {
      align-self: flex-end;
      background: #285b9b;
      border-bottom-right-radius: 4px;
    }

    .received {
      align-self: flex-start;
      background: #20344f;
      border-bottom-left-radius: 4px;
    }

    .message-time {
      display: block;
      font-size: 10px;
      color: #c1d0e4;
      margin-top: 5px;
      text-align: right;
    }

    #messageForm {
      flex-shrink: 0;
      display: flex;
      gap: 10px;
      padding: 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: #142640;
      border-top: 1px solid #263b56;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      height: 48px;
      padding: 0 15px;
      border: 1px solid #304965;
      border-radius: 25px;
      outline: none;
      background: #0b1a2e;
      color: white;
      font-size: 16px;
    }

    #messageInput:focus {
      border-color: #5597ed;
    }

    #messageInput::placeholder {
      color: #91a9c6;
    }

    #messageForm button {
      min-width: 70px;
    }

    /* Enlarged profile picture viewer */
    #photoViewer {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      padding: 65px 18px 28px;
      padding-top: max(65px, env(safe-area-inset-top));
      padding-bottom: max(28px, env(safe-area-inset-bottom));
      background: rgba(0, 0, 0, 0.94);
    }

    #photoViewer[hidden] {
      display: none !important;
    }

    #closePhotoViewer {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      padding: 0;
      background: #263b56;
      color: white;
      font-size: 22px;
    }

    #enlargedPhoto {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 75vh;
      max-height: 75dvh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 8px 35px rgba(0, 0, 0, 0.45);
    }

    #enlargedPhotoName {
      color: #f1f5fb;
      font-size: 16px;
      text-align: center;
      overflow-wrap: anywhere;
      max-width: 100%;
    }

    [hidden] {
      display: none !important;
    }

    @media (min-width: 600px) {
      .container {
        min-height: 90vh;
        min-height: 90dvh;
        max-height: 900px;
        margin-top: 5vh;
        border: 1px solid #203651;
        border-radius: 16px;
        overflow: hidden;
      }

      #chatScreen {
        min-height: 0;
      }

      #enlargedPhoto {
        max-height: 78vh;
        max-height: 78dvh;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <div class="top">
        <a href="dashboard.html" class="back" aria-label="Back to dashboard">‹</a>
        <h1 id="pageTitle">My Messages</h1>
      </div>

      <p class="subtitle" id="pageSubtitle">
        Select an accepted contact to start chatting.
      </p>
    </header>

    <div id="status" role="status">Connecting...</div>

    <section id="contactList"></section>

    <section id="chatScreen">
      <div class="chat-header">
        <button type="button" id="backToContacts">‹</button>
        <div class="avatar" id="chatAvatar">?</div>

        <div>
          <h3 id="chatName">Contact</h3>
          <p>SIMPLEXPING member</p>
        </div>
      </div>

      <div id="messages">
        <p class="empty">Your conversation will appear here.</p>
      </div>

      <form id="messageForm">
        <input
          type="text"
          id="messageInput"
          placeholder="Write a message..."
          maxlength="2000"
          autocomplete="off"
          enterkeyhint="send"
          aria-label="Write a message"
          required
        >
        <button type="submit" id="sendButton">Send</button>
      </form>
    </section>
  </main>

  <!-- Enlarged profile picture viewer -->
  <div id="photoViewer" hidden>
    <button
      type="button"
      id="closePhotoViewer"
      aria-label="Close enlarged profile picture"
    >✕</button>

    <img id="enlargedPhoto" src="" alt="Enlarged profile picture">
    <p id="enlargedPhotoName"></p>
  </div>

  <script type="module">
    import { auth, db } from "./firebase.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    import {
      doc,
      getDoc,
      getDocs,
      setDoc,
      collection,
      addDoc,
      query,
      where,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

    const contactList = document.getElementById("contactList");
    const chatScreen = document.getElementById("chatScreen");
    const messagesBox = document.getElementById("messages");
    const messageForm = document.getElementById("messageForm");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const statusText = document.getElementById("status");

    const pageTitle = document.getElementById("pageTitle");
    const pageSubtitle = document.getElementById("pageSubtitle");
    const chatName = document.getElementById("chatName");
    const chatAvatar = document.getElementById("chatAvatar");
    const backToContacts = document.getElementById("backToContacts");

    const photoViewer = document.getElementById("photoViewer");
    const enlargedPhoto = document.getElementById("enlargedPhoto");
    const enlargedPhotoName = document.getElementById("enlargedPhotoName");
    const closePhotoViewer = document.getElementById("closePhotoViewer");

    const requestedUserId = new URLSearchParams(
      window.location.search
    ).get("with");

    let currentUser = null;
    let conversationId = null;
    let otherUserId = null;
    let stopMessagesListener = null;
    let chatReady = false;
    let sending = false;
    let otherUserPhotoURL = "";

    function showStatus(text) {
      statusText.textContent = text;
    }

    function showEmpty(container, text) {
      container.replaceChildren();

      const paragraph = document.createElement("p");
      paragraph.className = "empty";
      paragraph.textContent = text;

      container.appendChild(paragraph);
    }

    function openPhotoViewer(name, photoURL) {
      if (!photoURL) return;

      enlargedPhoto.src = photoURL;
      enlargedPhoto.alt = name + "'s profile picture";
      enlargedPhotoName.textContent = name;

      photoViewer.hidden = false;
      closePhotoViewer.focus();
    }

    function closePhoto() {
      photoViewer.hidden = true;
      enlargedPhoto.removeAttribute("src");
    }

    closePhotoViewer.addEventListener("click", closePhoto);

    photoViewer.addEventListener("click", event => {
      if (event.target === photoViewer) {
        closePhoto();
      }
    });

    enlargedPhoto.addEventListener("error", () => {
      closePhoto();
      showStatus("Unable to open this profile picture.");
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !photoViewer.hidden) {
        closePhoto();
      }
    });

    // Display a profile picture, or the person's initial if unavailable.
    function setAvatar(element, name, photoURL) {
      element.replaceChildren();
      element.classList.remove("has-photo");
      element.removeAttribute("role");
      element.removeAttribute("tabindex");
      element.removeAttribute("aria-label");

      const initial = (name || "U").trim().charAt(0).toUpperCase() || "U";

      if (photoURL) {
        const image = document.createElement("img");
        image.src = photoURL;
        image.alt = name + "'s profile picture";
        image.loading = "lazy";

        image.addEventListener("error", () => {
          element.replaceChildren();
          element.textContent = initial;
          element.classList.remove("has-photo");
          element.removeAttribute("role");
          element.removeAttribute("tabindex");
          element.removeAttribute("aria-label");
        }, { once: true });

        element.appendChild(image);
        element.classList.add("has-photo");
        element.setAttribute("role", "button");
        element.setAttribute("tabindex", "0");
        element.setAttribute("aria-label", "View " + name + "'s profile picture");

        element.onclick = () => openPhotoViewer(name, photoURL);

        element.onkeydown = event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openPhotoViewer(name, photoURL);
          }
        };
      } else {
        element.textContent = initial;
        element.onclick = null;
        element.onkeydown = null;
      }
    }

    function showContact(contact) {
      const card = document.createElement("div");
      card.className = "contact";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      setAvatar(avatar, contact.name, contact.photoURL);

      const info = document.createElement("div");
      info.className = "contact-info";

      const name = document.createElement("h3");
      name.textContent = contact.name;

      const subtitle = document.createElement("p");
      subtitle.textContent = "Accepted contact";

      info.append(name, subtitle);

      const button = document.createElement("button");
      button.type = "button";
      button.textContent = "Message";

      button.addEventListener("click", () => {
        openChat(contact.uid);
      });

      card.append(avatar, info, button);
      contactList.appendChild(card);
    }

    async function loadContacts() {
      contactList.replaceChildren();
      showStatus("Loading your accepted contacts...");

      try {
        const contactsQuery = query(
          collection(db, "contacts"),
          where("participants", "array-contains", currentUser.uid)
        );

        const snapshot = await getDocs(contactsQuery);
        const contactIds = new Set();

        snapshot.forEach(contactDoc => {
          const participants = contactDoc.data().participants || [];

          participants.forEach(uid => {
            if (uid !== currentUser.uid) {
              contactIds.add(uid);
            }
          });
        });

        if (contactIds.size === 0) {
          showEmpty(contactList, "You haven't added any contacts yet.");

          const link = document.createElement("a");
          link.href = "contacts.html";
          link.textContent = "Find people in Contacts";

          contactList.firstChild.appendChild(link);
          showStatus("No accepted contacts yet.");
          return;
        }

        let displayed = 0;

        for (const uid of contactIds) {
          try {
            const userSnapshot = await getDoc(doc(db, "users", uid));

            if (!userSnapshot.exists()) {
              continue;
            }

            const data = userSnapshot.data();

            showContact({
              uid,
              name: data.fullName || data.username || "User",
              photoURL: data.photoURL || ""
            });

            displayed++;
          } catch (error) {
            console.error("Contact loading error:", error);
          }
        }

        if (displayed === 0) {
          showEmpty(contactList, "Your contacts could not be loaded.");
        }

        showStatus(displayed + " accepted contact(s).");
      } catch (error) {
        console.error("Contact list error:", error);
        showStatus("Unable to load contacts.");

        showEmpty(
          contactList,
          "Could not load your contacts. Please refresh and try again."
        );
      }
    }

    function showContactList() {
      if (stopMessagesListener) {
        stopMessagesListener();
        stopMessagesListener = null;
      }

      chatReady = false;
      conversationId = null;
      otherUserId = null;
      otherUserPhotoURL = "";

      chatScreen.style.display = "none";
      contactList.style.display = "flex";

      pageTitle.textContent = "My Messages";
      pageSubtitle.textContent =
        "Select an accepted contact to start chatting.";

      messageInput.value = "";
      messageForm.hidden = false;

      loadContacts();
    }

    async function checkAcceptedContact(uid) {
      const contactsQuery = query(
        collection(db, "contacts"),
        where("participants", "array-contains", currentUser.uid)
      );

      const snapshot = await getDocs(contactsQuery);

      return snapshot.docs.some(contactDoc => {
        const participants = contactDoc.data().participants || [];
        return participants.includes(uid);
      });
    }

    async function openChat(uid) {
      if (!uid || uid === currentUser.uid) {
        showStatus("Invalid contact.");
        return;
      }

      if (stopMessagesListener) {
        stopMessagesListener();
        stopMessagesListener = null;
      }

      otherUserId = uid;
      chatReady = false;
      conversationId = null;
      otherUserPhotoURL = "";

      contactList.style.display = "none";
      chatScreen.style.display = "flex";

      pageTitle.textContent = "Private Chat";
      pageSubtitle.textContent = "Your private conversation.";

      messagesBox.replaceChildren();
      showEmpty(messagesBox, "Opening conversation...");
      messageForm.hidden = true;

      try {
        showStatus("Checking accepted contact...");

        const accepted = await checkAcceptedContact(uid);

        if (!accepted) {
          showStatus("This person is not an accepted contact.");
          showEmpty(
            messagesBox,
            "Return to contacts and select an accepted contact."
          );
          return;
        }

        const userSnapshot = await getDoc(doc(db, "users", uid));

        if (!userSnapshot.exists()) {
          showStatus("Contact not found.");
          return;
        }

        const userData = userSnapshot.data();
        const name = userData.fullName || userData.username || "User";

        otherUserPhotoURL = userData.photoURL || "";

        chatName.textContent = name;
        setAvatar(chatAvatar, name, otherUserPhotoURL);

        const members = [currentUser.uid, uid].sort();
        conversationId = members.join("_");

        const conversationRef = doc(
          db,
          "conversations",
          conversationId
        );

        await setDoc(conversationRef, {
          participants: members,
          updatedAt: serverTimestamp()
        }, { merge: true });

        const messagesQuery = query(
          collection(db, "conversations", conversationId, "messages"),
          orderBy("createdAt", "asc"),
          limit(100)
        );

        stopMessagesListener = onSnapshot(
          messagesQuery,
          snapshot => {
            if (!conversationId || otherUserId !== uid) return;

            messagesBox.replaceChildren();

            if (snapshot.empty) {
              showEmpty(messagesBox, "No messages yet. Say hello!");
              return;
            }

            snapshot.forEach(messageDoc => {
              const messageData = messageDoc.data();
              const isSent = messageData.senderId === currentUser.uid;

              const message = document.createElement("div");
              message.className = "message " + (isSent ? "sent" : "received");

              const content = document.createElement("div");
              content.textContent = messageData.text || "";

              const time = document.createElement("span");
              time.className = "message-time"
