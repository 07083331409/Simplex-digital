
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#091426">
  <title>SIMPLEXPING | Chat</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    html {
      height: 100%;
    }

    body {
      background: #091426;
      color: #f1f5fb;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: stretch;
      overflow: hidden;
    }

    .chat-container {
      width: 100%;
      max-width: 850px;
      height: 100vh;
      height: 100dvh;
      background: #101f35;
      display: flex;
      flex-direction: column;
      border: 1px solid #203651;
      overflow: hidden;
    }

    .chat-header {
      flex-shrink: 0;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 13px;
      background: #142640;
      border-bottom: 1px solid #263b56;
      padding-top: max(15px, env(safe-area-inset-top));
    }

    .back-btn {
      color: #a9c6ec;
      text-decoration: none;
      font-size: 25px;
      padding: 5px;
    }

    .avatar {
      width: 43px;
      height: 43px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #28518a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
    }

    .contact-info {
      min-width: 0;
    }

    .contact-info h3 {
      font-size: 16px;
      margin-bottom: 5px;
      overflow-wrap: anywhere;
    }

    .contact-info p {
      color: #91a9c6;
      font-size: 12px;
    }

    #status {
      flex-shrink: 0;
      padding: 8px 15px;
      color: #a9c6ec;
      font-size: 12px;
      text-align: center;
    }

    .messages {
      flex: 1;
      min-height: 0;
      padding: 15px;
      overflow-y: auto;
      overscroll-behavior: contain;
      display: flex;
      flex-direction: column;
      gap: 13px;
      -webkit-overflow-scrolling: touch;
    }

    .empty-message {
      text-align: center;
      color: #8499b5;
      margin: auto;
      font-size: 14px;
      line-height: 1.6;
    }

    .message {
      max-width: 82%;
      padding: 12px 15px;
      border-radius: 15px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .sent {
      align-self: flex-end;
      background: #285b9b;
      border-bottom-right-radius: 4px;
    }

    .received {
      align-self: flex-start;
      background: #20344f;
      border-bottom-left-radius: 4px;
    }

    .message-time {
      display: block;
      font-size: 10px;
      color: #c1d0e4;
      margin-top: 5px;
      text-align: right;
    }

    .message-form {
      flex-shrink: 0;
      width: 100%;
      padding: 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 10px;
      background: #142640;
      border-top: 1px solid #263b56;
      position: relative;
      z-index: 5;
    }

    .message-form input {
      flex: 1;
      min-width: 0;
      width: 0;
      height: 48px;
      padding: 0 16px;
      border: 1px solid #304965;
      border-radius: 25px;
      outline: none;
      background: #0b1a2e;
      color: white;
      font-size: 16px;
      appearance: none;
      -webkit-appearance: none;
      pointer-events: auto;
      touch-action: manipulation;
      user-select: text;
      -webkit-user-select: text;
    }

    .message-form input:focus {
      border-color: #5597ed;
    }

    .message-form input::placeholder {
      color: #91a9c6;
    }

    .message-form button {
      flex-shrink: 0;
      height: 46px;
      border: none;
      background: #3978c7;
      color: white;
      padding: 0 19px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    .message-form button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message-form[hidden] {
      display: none;
    }

    @media (min-width: 600px) {
      body {
        align-items: center;
      }

      .chat-container {
        height: 90vh;
        height: 90dvh;
        max-height: 900px;
        border-radius: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="chat-container">

    <header class="chat-header">
      <a href="contacts.html" class="back-btn" aria-label="Back to contacts">‹</a>

      <div class="avatar" id="avatar">?</div>

      <div class="contact-info">
        <h3 id="contactName">Loading...</h3>
        <p id="contactStatus">SIMPLEXPING</p>
      </div>
    </header>

    <div id="status" role="status">Connecting to chat...</div>

    <section class="messages" id="messages">
      <p class="empty-message">Your conversation will appear here.</p>
    </section>

    <form class="message-form" id="messageForm" hidden>
      <input
        type="text"
        id="messageInput"
        placeholder="Write a message..."
        maxlength="2000"
        autocomplete="off"
        enterkeyhint="send"
        aria-label="Write a message"
        required
      >

      <button type="submit" id="sendButton">Send</button>
    </form>

  </main>

  <script type="module">
    import { auth, db } from "./firebase.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    import {
      doc,
      getDoc,
      getDocs,
      setDoc,
      collection,
      addDoc,
      query,
      where,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

    const messagesBox = document.getElementById("messages");
    const messageForm = document.getElementById("messageForm");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const statusText = document.getElementById("status");

    const contactName = document.getElementById("contactName");
    const contactStatus = document.getElementById("contactStatus");
    const avatar = document.getElementById("avatar");

    const otherUserId = new URLSearchParams(
      window.location.search
    ).get("with");

    let currentUser = null;
    let conversationId = null;
    let stopMessagesListener = null;
    let chatReady = false;
    let sending = false;

    function showStatus(text) {
      statusText.textContent = text;
    }

    function showEmpty(text) {
      messagesBox.replaceChildren();

      const empty = document.createElement("p");
      empty.className = "empty-message";
      empty.textContent = text;

      messagesBox.appendChild(empty);
    }

    function showMessage(text, senderId, timestamp) {
      const message = document.createElement("div");

      message.className = "message " +
        (senderId === currentUser.uid ? "sent" : "received");

      const content = document.createElement("div");
      content.textContent = text;

      const time = document.createElement("span");
      time.className = "message-time";

      if (timestamp && timestamp.toDate) {
        time.textContent = timestamp.toDate().toLocaleTimeString(
          [],
          { hour: "2-digit", minute: "2-digit" }
        );
      } else {
        time.textContent = "Sending...";
      }

      message.append(content, time);
      messagesBox.appendChild(message);
    }

    async function checkAcceptedContact() {

      const contactsQuery = query(
        collection(db, "contacts"),
        where("participants", "array-contains", currentUser.uid)
      );

      const snapshot = await getDocs(contactsQuery);

      return snapshot.docs.some(contact => {
        const participants = contact.data().participants || [];

        return participants.includes(otherUserId);
      });
    }

    async function startChat() {

      if (!otherUserId || otherUserId === currentUser.uid) {
        showStatus("Invalid contact. Return to your contacts.");
        showEmpty("This conversation cannot be opened.");
        return;
      }

      try {

        showStatus("Checking contact connection...");

        const isAccepted = await checkAcceptedContact();

        if (!isAccepted) {
          showStatus("You must accept a contact request before chatting.");
          showEmpty("This person is not in your accepted contacts.");
          return;
        }

        const userRef = doc(db, "users", otherUserId);
        const userSnapshot = await getDoc(userRef);

        if (!userSnapshot.exists()) {
          showStatus("This user could not be found.");
          return;
        }

        const otherUser = userSnapshot.data();
        const name = otherUser.fullName || otherUser.username || "User";

        contactName.textContent = name;
        avatar.textContent = name.charAt(0).toUpperCase();
        contactStatus.textContent = "SIMPLEXPING member";

        const members = [currentUser.uid, otherUserId].sort();

        conversationId = members.join("_");

        const conversationRef = doc(
          db,
          "conversations",
          conversationId
        );

        await setDoc(conversationRef, {
          participants: members,
          updatedAt: serverTimestamp()
        }, { merge: true });

        const messagesQuery = query(
          collection(db, "conversations", conversationId, "messages"),
          orderBy("createdAt", "asc"),
          limit(100)
        );

        stopMessagesListener = onSnapshot(
          messagesQuery,
          snapshot => {

            messagesBox.replaceChildren();

            if (snapshot.empty) {
              showEmpty("No messages yet. Say hello!");
              return;
            }

            snapshot.forEach(messageDoc => {
              const data = messageDoc.data();

              showMessage(
                data.text,
                data.senderId,
                data.createdAt
              );
            });

            messagesBox.scrollTop = messagesBox.scrollHeight;

          },
          error => {
            console.error("Message listener error:", error);
            showStatus("Unable to load messages. Check Firestore permissions.");
          }
        );

        chatReady = true;
        messageForm.hidden = false;

        showStatus("Chat connected.");

      } catch (error) {

        console.error("Chat opening error:", error);
        showStatus("Could not open chat: " + error.message);

      }
    }

    messageForm.addEventListener("submit", async event => {

      event.preventDefault();

      const text = messageInput.value.trim();

      if (!text || !conversationId || !chatReady || sending) {
        return;
      }

      sending = true;
      sendButton.disabled = true;

      try {

        const messagesRef = collection(
          db,
          "conversations",
          conversationId,
          "messages"
        );

        await addDoc(messagesRef, {
          text: text,
          senderId: currentUser.uid,
          createdAt: serverTimestamp()
        });

        await setDoc(
          doc(db, "conversations", conversationId),
          { updatedAt: serverTimestamp() },
          { merge: true }
        );

        messageInput.value = "";
        showStatus("Message sent.");

        messageInput.focus();

      } catch (error) {

        console.error("Message sending error:", error);
        showStatus("Message not sent: " + error.message);

      } finally {

        sending = false;
        sendButton.disabled = false;

      }

    });

    onAuthStateChanged(auth, user => {

      if (!user) {
        window.location.replace("login.html");
        return;
      }

      currentUser = user;
      startChat();

    });

    window.addEventListener("pagehide", () => {

      if (stopMessagesListener) {
        stopMessagesListener();
      }

    });

  </script>

</body>
</html>
