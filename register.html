
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | SIMPLEXPING</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: #0B1424;
  color: #EDF3FC;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px 15px;
}

.container {
  width: 100%;
  max-width: 440px;
  background: #111E32;
  padding: 38px 30px;
  border: 1px solid #263750;
  border-radius: 18px;
  box-shadow: 0 15px 45px rgba(0,0,0,.3);
}

.logo {
  text-align: center;
  margin-bottom: 30px;
}

.logo-mark {
  width: 52px;
  height: 52px;
  margin: 0 auto 12px;
  border-radius: 15px;
  background: linear-gradient(135deg, #244B7D, #3978D5);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
  font-weight: bold;
  color: white;
}

.logo h2 {
  font-size: 23px;
  letter-spacing: 1px;
}

.logo h2 span {
  color: #5C99F0;
}

.logo p {
  color: #9AAAC0;
  font-size: 13px;
  margin-top: 8px;
}

h1 {
  font-size: 25px;
  margin-bottom: 9px;
}

.subtitle {
  color: #9AAAC0;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 25px;
}

.form-group {
  margin-bottom: 18px;
}

label {
  display: block;
  margin-bottom: 9px;
  font-size: 13px;
  font-weight: bold;
  color: #DCE6F5;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #31435E;
  border-radius: 9px;
  outline: none;
  background: #0D192B;
  color: white;
  font-size: 14px;
}

input:focus {
  border-color: #3978D5;
  box-shadow: 0 0 0 3px rgba(57,120,213,.12);
}

input::placeholder {
  color: #71839D;
}

.picture-group {
  margin-bottom: 20px;
}

.picture-upload {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px;
  border: 1px solid #31435E;
  border-radius: 12px;
  background: #0D192B;
}

.picture-preview {
  width: 76px;
  height: 76px;
  flex: 0 0 76px;
  display: grid;
  place-items: center;
  overflow: hidden;
  border: 2px solid #3978D5;
  border-radius: 50%;
  background: #1B3556;
  color: #A8C9F7;
  font-size: 25px;
}

.picture-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.picture-details {
  min-width: 0;
}

.picture-button {
  padding: 10px 13px;
  border: 1px solid #355579;
  border-radius: 8px;
  background: #203D60;
  color: #DCEBFF;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
}

.picture-button:hover {
  background: #315782;
}

.picture-help {
  margin-top: 7px;
  color: #8293AA;
  font-size: 11px;
  line-height: 1.5;
}

#pictureInput {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  clip-path: inset(50%);
}

.submit-spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  margin-right: 8px;
  vertical-align: -2px;
  border: 2px solid rgba(255, 255, 255, .45);
  border-top-color: white;
  border-radius: 50%;
  animation: spin .7s linear infinite;
}

.submit-spinner[hidden] {
  display: none;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.password-note {
  font-size: 11px;
  color: #8293AA;
  margin-top: 7px;
}

.submit-btn {
  width: 100%;
  padding: 15px;
  background: #3978D5;
  border: none;
  border-radius: 9px;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 8px;
}

.submit-btn:hover {
  background: #2B65B9;
}

.submit-btn:disabled {
  opacity: .65;
  cursor: not-allowed;
}

.message {
  display: none;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 17px;
  font-size: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.message.error {
  display: block;
  background: #48232B;
  color: #FFB9C3;
}

.message.success {
  display: block;
  background: #173E3A;
  color: #A2E8D1;
}

.login-link {
  text-align: center;
  margin-top: 25px;
  font-size: 13px;
  color: #9AAAC0;
}

.login-link a {
  color: #69A5FA;
  text-decoration: none;
  font-weight: bold;
}

.login-link a:hover {
  text-decoration: underline;
}

.terms {
  text-align: center;
  color: #71839D;
  font-size: 11px;
  margin-top: 25px;
  line-height: 1.6;
}

@media(max-width: 400px) {
  .container {
    padding: 30px 20px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    <div class="logo-mark">S</div>
    <h2>SIMPLEX<span>PING</span></h2>
    <p>Connect. Communicate. Belong.</p>
  </div>

  <h1>Create your account</h1>
  <p class="subtitle">
    Join SIMPLEXPING and start connecting with people.
  </p>

  <div id="message" class="message" role="alert"></div>

  <form id="registerForm">

    <div class="picture-group">
      <label for="pictureInput">Profile picture <span aria-hidden="true">*</span></label>
      <div class="picture-upload">
        <div class="picture-preview" id="picturePreview" aria-label="Profile picture preview">
          <span id="picturePlaceholder" aria-hidden="true">+</span>
          <img id="picturePreviewImage" alt="Selected profile picture preview" hidden>
        </div>
        <div class="picture-details">
          <button type="button" class="picture-button" id="choosePictureBtn">
            Choose picture
          </button>
          <p class="picture-help" id="pictureHelp">
            Required. JPEG, PNG or WebP, up to 2 MB.
          </p>
        </div>
      </div>
      <input type="file" id="pictureInput"
        accept="image/jpeg,image/png,image/webp"
        aria-describedby="pictureHelp">
    </div>

    <div class="form-group">
      <label for="fullName">Full name</label>
      <input type="text" id="fullName"
        placeholder="Enter your full name"
        autocomplete="name" required maxlength="80">
    </div>

    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email"
        placeholder="example@email.com"
        autocomplete="email" required>
    </div>

    <div class="form-group">
      <label for="password">Create password</label>
      <input type="password" id="password"
        placeholder="Create a password"
        autocomplete="new-password"
        minlength="8" required>
      <p class="password-note">
        Use at least 8 characters.
      </p>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm password</label>
      <input type="password" id="confirmPassword"
        placeholder="Enter password again"
        autocomplete="new-password" required>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">
      <span class="submit-spinner" id="submitSpinner" aria-hidden="true" hidden></span>
      <span id="submitLabel">
      Create Account
      </span>
    </button>

  </form>

  <div class="login-link">
    Already have an account?
    <a href="login.html">Log in</a>
  </div>

  <div class="terms">
    By creating an account, you agree to use SIMPLEXPING responsibly.
  </div>

</div>

<script type="module">

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");
const submitLabel = document.getElementById("submitLabel");
const submitSpinner = document.getElementById("submitSpinner");
const pictureInput = document.getElementById("pictureInput");
const choosePictureBtn = document.getElementById("choosePictureBtn");
const picturePreviewImage = document.getElementById("picturePreviewImage");
const picturePlaceholder = document.getElementById("picturePlaceholder");

const CLOUD_NAME = "ewzaj6yw";
const UPLOAD_PRESET = "simplexping_profiles";
const MAX_FILE_SIZE = 2 * 1024 * 1024;
const ALLOWED_IMAGE_TYPES = [
  "image/jpeg",
  "image/png",
  "image/webp"
];

let selectedPicture = null;
let previewObjectURL = null;
let submitting = false;

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
}

function showError(error, stage) {
  console.error("SIMPLEXPING registration error:", error);

  const code = error?.code || "unknown-error";
  const details = error?.message || String(error);

  showMessage(
    "Registration failed during: " + stage +
    "\nError code: " + code +
    "\nDetails: " + details,
    "error"
  );
}

function showPicturePreview(file) {
  selectedPicture = file;

  if (previewObjectURL) {
    URL.revokeObjectURL(previewObjectURL);
  }

  previewObjectURL = URL.createObjectURL(file);
  picturePreviewImage.src = previewObjectURL;
  picturePreviewImage.hidden = false;
  picturePlaceholder.hidden = true;
  choosePictureBtn.textContent = "Change picture";
}

pictureInput.addEventListener("change", () => {
  const file = pictureInput.files?.[0];
  if (!file) return;

  if (!ALLOWED_IMAGE_TYPES.includes(file.type)) {
    showMessage("Choose a JPEG, PNG, or WebP image.", "error");
    pictureInput.value = "";
    return;
  }

  if (file.size === 0 || file.size > MAX_FILE_SIZE) {
    showMessage(
      file.size === 0
        ? "The selected picture is empty. Choose another image."
        : "Your picture is larger than 2 MB. Choose a smaller image.",
      "error"
    );
    pictureInput.value = "";
    return;
  }

  showPicturePreview(file);
  showMessage("Picture selected. You can change it before creating your account.", "success");
});

choosePictureBtn.addEventListener("click", () => {
  if (!submitting) pictureInput.click();
});

async function uploadPicture(file) {
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", UPLOAD_PRESET);

  let response;

  try {
    response = await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
      { method: "POST", body: formData }
    );
  } catch {
    throw new Error("Could not connect to Cloudinary. Check your connection and try again.");
  }

  let result;

  try {
    result = await response.json();
  } catch {
    throw new Error("Cloudinary returned an invalid response. Please try again.");
  }

  if (!response.ok || !result.secure_url) {
    throw new Error(
      result.error?.message || "Cloudinary could not upload your picture. Please try again."
    );
  }

  return result.secure_url;
}

function setSubmitting(isSubmitting, label = "Create Account") {
  submitting = isSubmitting;
  submitBtn.disabled = isSubmitting;
  choosePictureBtn.disabled = isSubmitting;
  pictureInput.disabled = isSubmitting;
  submitSpinner.hidden = !isSubmitting;
  submitLabel.textContent = label;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (submitting) return;

  if (!selectedPicture) {
    showMessage("Please choose a profile picture before creating your account.", "error");
    choosePictureBtn.focus();
    return;
  }

  const fullName = document.getElementById("fullName").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (fullName.length < 2) {
    showMessage("Please enter your full name.", "error");
    return;
  }

  if (password.length < 8) {
    showMessage("Your password must contain at least 8 characters.", "error");
    return;
  }

  if (password !== confirmPassword) {
    showMessage("Your passwords do not match.", "error");
    return;
  }

  setSubmitting(true, "Uploading picture...");

  let stage = "Uploading profile picture";

  try {

    const photoURL = await uploadPicture(selectedPicture);

    setSubmitting(true, "Creating account...");

    // Load Firebase modules and configuration.
    const firebase = await import("./firebase.js");

    const auth = firebase.auth;
    const db = firebase.db;

    const authFunctions = await import(
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js"
    );

    const firestoreFunctions = await import(
      "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js"
    );

    if (!auth || !db) {
      throw new Error("Firebase Auth or Firestore was not initialized.");
    }

    stage = "Creating Firebase Authentication account";

    const credential = await authFunctions.createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    const user = credential.user;

    stage = "Saving user name and profile picture";

    await authFunctions.updateProfile(user, {
      displayName: fullName,
      photoURL: photoURL
    });

    stage = "Saving user profile in Firestore";

    await firestoreFunctions.setDoc(
      firestoreFunctions.doc(db, "users", user.uid),
      {
        uid: user.uid,
        fullName: fullName,
        email: user.email,
        photoURL: photoURL,
        status: "offline",
        createdAt: firestoreFunctions.serverTimestamp()
      }
    );

    showMessage(
      "Account created successfully! Taking you to login...",
      "success"
    );

    form.reset();
    selectedPicture = null;

    setTimeout(() => {
      window.location.href = "login.html?registered=1";
    }, 1800);

  } catch (error) {

    showError(error, stage);

  } finally {
    setSubmitting(false);

  }
});

</script>

</body>
</html>
